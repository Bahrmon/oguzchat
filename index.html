#auth{margin:auto;background:var(--card);border-radius:18px;box-shadow:0 20px 50px #06306a26;width:min(400px,92vw);overflow:hidden;animation:cardIn .55s var(--ease) both}
#auth .top{background:linear-gradient(135deg,#06306A,#164194);color:#fff;padding:30px 30px 26px}
#auth .brand{font-family:Montserrat,sans-serif;font-weight:700;font-size:26px;animation:fadeUp .6s .15s var(--ease) both}
#auth .sub{opacity:.75;font-size:13px;margin-top:4px;animation:fadeUp .6s .25s var(--ease) both}
#auth .body{padding:24px 30px 18px}
#auth h2{margin:0 0 12px;font-family:Montserrat,sans-serif;font-size:18px;color:var(--title)}
.inp{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);margin:6px 0;background:var(--card);outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px #16419422}
.btn{width:100%;padding:12px;border-radius:10px;border:none;background:var(--blue);color:#fff;font-weight:600;margin-top:8px;position:relative;overflow:hidden;transition:transform .15s var(--spring),background .15s,box-shadow .15s}
.btn:hover{background:#06306A;box-shadow:0 6px 16px #16419440;transform:translateY(-1px)}
.btn:active{transform:scale(.95)}
.btn.ghost{background:var(--band);color:var(--title)}
.btn.danger{background:#fff0f0;color:#C62828}
[data-theme=dark] .btn.danger{background:#3a1d22;color:#ff8a80}
button.link{background:none;border:none;color:var(--blue-l);padding:10px 0 0;font-weight:500}
#err{color:#c62828;min-height:1.2em;font-size:13px}
#auth.shake{animation:shake .4s}
.powered{font-size:11px;color:var(--muted);text-align:center;padding:0 0 14px;letter-spacing:.3px}
.powered b{color:var(--blue);font-weight:600}
#app{display:flex;width:100%;height:100vh;height:100dvh}
#app.enter #side{animation:slideIn .45s var(--ease) both}
#app.enter .item{animation:slideIn .4s var(--ease) both}
#app.enter #main{animation:fadeUp .5s .1s var(--ease) both}
#side{width:280px;flex-shrink:0;background:var(--side);color:#fff;display:flex;flex-direction:column;transition:transform .3s var(--ease)}
#side .logo{font-family:Montserrat,sans-serif;font-weight:700;font-size:20px;padding:18px 16px 12px 20px;display:flex;align-items:center;gap:10px}
#side .logo .mark{width:34px;height:34px;border-radius:10px;overflow:hidden;display:block;flex-shrink:0}#side .logo .mark img{width:100%;height:100%;display:block}
#side .logo .grow{flex:1}
.iconbtn{border:none;background:#ffffff14;color:#fff;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px;transition:transform .15s var(--spring),background .15s}
.iconbtn:hover{background:#ffffff26}.iconbtn:active{transform:scale(.9)}
#side .scroll{flex:1;overflow-y:auto;padding-bottom:10px}
#side h3{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#ffffff80;margin:16px 20px 6px;display:flex;align-items:center}
#side h3 button{margin-left:auto;background:none;border:none;color:#ffffffa0;line-height:1;padding:3px;border-radius:6px;display:grid;place-items:center}
#side h3 button:hover{color:#fff;background:#ffffff1a}
#findUser{margin:4px 12px 2px;width:calc(100% - 24px);padding:8px 12px;border-radius:9px;border:none;background:#ffffff14;color:#fff;outline:none;font-size:13px}
#findUser::placeholder{color:#ffffff70}
.item{display:flex;align-items:center;gap:10px;padding:7px 10px;margin:2px 8px;border-radius:10px;color:#ffffffd0;transition:background .12s,transform .12s;position:relative;overflow:hidden;cursor:pointer}
.item:hover{background:#ffffff14;color:#fff}
.item:active{transform:scale(.97)}
.item.active{background:#164194;color:#fff;box-shadow:0 4px 14px #0003}
.item.unread{color:#fff;font-weight:600}
.item .ic{width:30px;display:grid;place-items:center;opacity:.65;font-weight:600;flex-shrink:0}
.item .lbl{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{display:block;font-size:11px;font-weight:400;opacity:.6;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{margin-left:auto;background:#E53935;color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px;flex-shrink:0}
.del{opacity:0;border:none;background:none;color:#fff;width:24px;height:24px;border-radius:6px;font-size:16px;line-height:1;transition:opacity .15s,background .15s;flex-shrink:0}
.item:hover .del{opacity:.7}.del:hover{opacity:1!important;background:#E5393580}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;color:#fff;flex-shrink:0;position:relative;user-select:none;overflow:visible}
.av img{border-radius:50%}
@keyframes dotBlink{0%,100%{opacity:1}50%{opacity:.4}}
.av.on::after{content:"";position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;background:#2ECC71;border:2px solid var(--side);box-shadow:0 1px 2px #0004;z-index:3;animation:dotBlink 2.6s ease-in-out infinite}
.av.ceo::before{content:"👑";position:absolute;top:-11px;left:50%;transform:translateX(-50%);font-size:12px;line-height:1;pointer-events:none;z-index:2}
#me{padding:12px 14px;border-top:1px solid #ffffff1a;display:flex;align-items:center;gap:10px;cursor:pointer;transition:background .15s}
#me:hover{background:#ffffff10}#me.active{background:#ffffff1a}
#me .nmw{flex:1;min-width:0}#me .nm{display:block;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#logout{background:#ffffff14;border:none;color:#fff;border-radius:8px;padding:7px 10px;font-size:13px}
#logout:hover{background:#ffffff26}
#side .powered{color:#ffffff66;padding:6px 0 10px}#side .powered b{color:#ffffffb0}
#main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--card);position:relative}
#head,#selBar{min-height:64px;padding:8px 16px 8px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;background:var(--card)}
#head .hinfo{flex:1;min-width:0;cursor:default}
#head .hinfo.click{cursor:pointer}
#selBar{gap:10px}
#selBar .hinfo{flex:1;min-width:0}
#selCount{font-weight:600;font-size:15px}
#selDel{color:#E53935}
@media(max-width:760px){#selBar{padding:8px 10px}}
#title{font-family:Montserrat,sans-serif;font-weight:600;font-size:17px;color:var(--title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#subtitle{font-size:12px;color:var(--muted);min-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#subtitle.online{color:#2E9E5B}
.hbtn{border:none;background:var(--band);color:var(--title);border-radius:10px;height:38px;min-width:38px;padding:0 10px;display:grid;place-items:center;font-size:15px;line-height:1;transition:transform .15s var(--spring)}
.hbtn:active{transform:scale(.92)}
#bell{font-size:13px;font-weight:600;display:flex;gap:7px;align-items:center}
#bell.on{background:none;color:var(--muted);font-weight:500}
#menuBtn{display:none}
#searchBar{display:flex;gap:8px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--card);animation:fadeUp .2s var(--ease)}
#searchBar input{flex:1;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--band);outline:none}
#searchInfo{font-size:12px;color:var(--muted);white-space:nowrap}
#pinBar{display:flex;align-items:center;gap:10px;padding:8px 16px 8px 20px;border-bottom:1px solid var(--line);background:var(--card);font-size:13px;cursor:pointer;animation:fadeUp .25s var(--ease)}
#pinBar .pl{border-left:3px solid var(--blue);padding-left:10px;flex:1;min-width:0}
#pinBar .pt{color:var(--blue-l);font-weight:600;font-size:12px}
#pinBar .px{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
#pinBar button{border:none;background:none;color:var(--muted);border-radius:6px;padding:4px;display:grid;place-items:center}
#pinIco{color:var(--blue-l);display:grid;place-items:center}
#msgs{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 20px 8px;background:var(--band);position:relative}
#title.switch{animation:fadeUp .3s var(--ease)}
#msgs.switch{animation:fadeIn .2s ease}
#msgs.loading{opacity:.35;pointer-events:none;transition:opacity .12s}
#msgs.drag{outline:3px dashed var(--blue);outline-offset:-10px}
.day{text-align:center;margin:18px 0 8px;font-size:11.5px;color:var(--muted);letter-spacing:.2px;user-select:none}
.day b{font-weight:600}
.empty{text-align:center;color:var(--muted);margin-top:18vh}
.row{display:flex;gap:8px;align-items:flex-end;margin:2px 0;position:relative;touch-action:pan-y;transition:padding-left .22s var(--ease),background .18s}
.selck{position:absolute;left:4px;top:50%;transform:translateY(-50%) scale(.4);width:20px;height:20px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;color:transparent;opacity:0;pointer-events:none;transition:all .22s var(--spring);z-index:2}
#msgs.selecting{cursor:pointer}
#msgs.selecting .row{padding-left:32px}
#msgs.selecting .row .selck{opacity:1;transform:translateY(-50%) scale(1)}
#msgs.selecting .row .tools{display:none}
.selck.on{background:var(--blue-l);border-color:var(--blue-l);color:#fff}
.row.sel-on .bubble{box-shadow:0 0 0 2px var(--blue-l) inset}
.row.mine{flex-direction:row-reverse}
.row>.av{width:30px;height:30px;font-size:11px;visibility:hidden;cursor:pointer;margin-bottom:1px}
.row.last>.av{visibility:visible}
.row.mine>.av,#msgs.dm .row>.av{display:none}
.row.first{margin-top:10px}
.row.flash .bwrap{animation:hl .9s var(--ease)}
.row.flash::after{content:"";position:absolute;inset:-4px -24px;background:#006FB51f;pointer-events:none;animation:fadeOut 1.6s ease forwards}
.bwrap{display:flex;flex-direction:column;align-items:flex-start;max-width:min(72%,580px);min-width:0;position:relative;transition:transform .3s var(--spring)}
.row.mine .bwrap{align-items:flex-end;transform-origin:right center}
.row:not(.mine) .bwrap{transform-origin:left center}
.bubble{padding:7px 12px;background:var(--bubble);color:var(--text);border-radius:18px;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.38;position:relative;z-index:0;max-width:100%}
.row:not(.mine) .bubble{filter:drop-shadow(0 .5px .6px #06306a2e)}
[data-theme=dark] .row:not(.mine) .bubble{filter:none}
.row.mine .bubble{background:var(--mine);color:var(--mine-text)}
.row.last:not(.mine) .bubble{border-bottom-left-radius:6px}
.row.mine.last .bubble{border-bottom-right-radius:6px}
.row.last .bubble::before{content:"";position:absolute;bottom:0;left:-6px;width:16px;height:20px;background:inherit;z-index:-1;-webkit-mask:var(--tail) no-repeat 0 0/100% 100%;mask:var(--tail) no-repeat 0 0/100% 100%;transform:scaleX(-1)}
.row.mine.last .bubble::before{left:auto;right:-6px;transform:none}
.bubble.jumbo{background:none!important;filter:none!important;padding:0 2px;font-size:42px;line-height:1.12}
.bubble.jumbo::before{display:none}
.row.mine .bubble.jumbo{color:var(--text)}
.bubble.jumbo .foot{float:none;display:flex;justify-content:flex-end;margin:0 0 2px;color:var(--muted)!important}
.meta{font-size:12px;font-weight:600;margin-bottom:1px;cursor:pointer;white-space:normal}
.meta .pos{font-weight:400;color:var(--muted);margin-left:6px;font-size:11px}
.foot{font-size:10.5px;line-height:1;color:var(--muted);margin:7px 0 -2px 10px;float:right;display:inline-flex;gap:3px;align-items:center;white-space:nowrap;user-select:none}
.row.mine .foot{color:#ffffffb0}
.tick{display:inline-flex}.tick.read{color:#8FD3FF}
.rstatus{font-size:11px;font-weight:500;color:var(--muted);text-align:right;margin:3px 4px 4px 0;transition:opacity .3s;user-select:none}
.rstatus.wait{opacity:0;transition:none}
.tools{position:absolute;top:50%;display:flex;gap:2px;opacity:0;pointer-events:none;transform:translateY(-50%);transition:opacity .15s;z-index:4}
.row:not(.mine) .tools{left:calc(100% + 4px)}
.row.mine .tools{right:calc(100% + 4px);flex-direction:row-reverse}
@media(hover:hover){.row:hover .tools{opacity:1;pointer-events:auto}}
.tools button{width:28px;height:28px;border-radius:50%;border:none;background:none;color:var(--muted);display:grid;place-items:center;padding:0;transition:background .12s,color .12s,transform .15s var(--spring)}
.tools button:hover{background:var(--card);color:var(--title);box-shadow:0 1px 4px #06306a24}
.tools button:active{transform:scale(.86)}
.swipe-ic{position:absolute;left:0;top:50%;width:30px;height:30px;margin-top:-15px;border-radius:50%;background:var(--card);color:var(--blue-l);display:grid;place-items:center;box-shadow:0 1px 4px #06306a26;pointer-events:none;opacity:0;transition:background .15s,color .15s}
.swipe-ic.armed{background:var(--blue);color:#fff}
.flyer{position:fixed!important;top:0;left:0;margin:0!important;z-index:70;pointer-events:none;will-change:transform}
.fwd-hdr{font-size:12px;color:var(--blue-l);margin-bottom:4px;display:flex;align-items:center;gap:4px;white-space:normal}
.fwd-hdr b{font-weight:600}.fwd-hdr .ff{opacity:.7}
.row.mine .fwd-hdr{color:#cfe0ff}
.badge-ceo{font-size:13px;vertical-align:middle;margin-left:3px}
.badge-admin{font-size:10px;font-weight:700;background:var(--blue);color:#fff;border-radius:5px;padding:1px 5px;vertical-align:middle;margin-left:4px;letter-spacing:.3px}
#fwdPick{position:fixed;inset:0;z-index:40;background:#0006;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
#fwdPick .sheet{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:500px;max-height:76vh;display:flex;flex-direction:column;overflow:hidden;animation:fadeUp .28s var(--spring) both}
#fwdPick .sh{padding:16px 20px 10px;font-family:Montserrat,sans-serif;font-weight:600;font-size:16px;color:var(--title);border-bottom:1px solid var(--line)}
#fwdPick .sg{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:10px 12px 4px}
#fwdPick .sl{overflow-y:auto;flex:1;padding:6px}
#fwdPick .si{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;cursor:pointer;transition:background .12s}
#fwdPick .si:hover{background:var(--hover)}
#fwdPick .si .ic2{width:36px;height:36px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:700;flex-shrink:0}
#fwdPick .cancel{border:none;background:none;color:var(--muted);padding:14px;font-size:14px;width:100%;border-top:1px solid var(--line);transition:background .12s}
#fwdPick .cancel:hover{background:var(--hover)}
.quote{border-left:3px solid var(--blue-l);background:var(--quote);border-radius:8px;padding:5px 9px;margin:2px 0 6px;font-size:13px;cursor:pointer;white-space:normal}
.row.mine .quote{background:#ffffff22;border-left-color:#fff}
.quote b{display:block;font-size:12px;color:var(--blue-l)}
.row.mine .quote b{color:#fff}
.quote span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85}
.img{display:block;max-width:100%;max-height:320px;border-radius:10px;margin:2px 0 4px;cursor:zoom-in;background:#0001}
.filecard{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--quote);text-decoration:none;color:inherit;margin:2px 0 4px;white-space:normal}
.row.mine .filecard{background:#ffffff22;color:#fff}
.filecard .fi{width:38px;height:38px;border-radius:9px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.filecard .fn{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.filecard .fs{font-size:11px;opacity:.7}
mark{background:#FFE082;color:#000;border-radius:3px;padding:0 1px}
.reacts{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:2px 8px;font-size:13px;display:flex;gap:4px;align-items:center;transition:transform .15s var(--spring)}
.chip.me{border-color:var(--blue);background:#16419418}
.chip:active{transform:scale(.9)}
.chip b{font-size:12px;font-weight:600;color:var(--muted)}
.pop{position:fixed;z-index:20;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px #06306a33;padding:8px;display:grid;gap:2px;animation:popIn .2s var(--spring) both}
.pop button{border:none;background:none;font-size:20px;width:36px;height:36px;border-radius:9px;transition:background .1s,transform .12s var(--spring)}
.pop button:hover{background:var(--hover);transform:scale(1.15)}
#ctxShade{position:fixed;inset:0;z-index:60;background:#06306a1f;-webkit-backdrop-filter:blur(10px) saturate(1.2);backdrop-filter:blur(10px) saturate(1.2);animation:fadeIn .2s}
[data-theme=dark] #ctxShade{background:#00000070}
.row.lifted{z-index:61}
.row.lifted .bwrap{transform:scale(1.035)}
.row.lifted .tools{opacity:0!important}
.tapback,.mact{position:fixed;z-index:62;background:var(--card);box-shadow:0 12px 34px #06306a33,0 0 0 .5px var(--line);animation:ctxIn .34s var(--spring) both}
.tapback{display:flex;gap:2px;border-radius:26px;padding:4px}
.tapback button{font-size:22px;width:38px;height:38px;border-radius:50%;border:none;background:none;padding:0;display:grid;place-items:center;line-height:1;transition:transform .18s var(--spring),background .12s}
.tapback button:hover{transform:scale(1.2)}
.tapback button.on{background:#16419426}
.mact{border-radius:14px;min-width:220px;overflow:hidden;animation-delay:.03s}
.mact button{width:100%;border:none;background:none;padding:11px 14px;display:flex;align-items:center;justify-content:space-between;gap:18px;font-size:14.5px;color:var(--text);cursor:pointer;text-align:left;transition:background .1s}
.mact button+button{box-shadow:inset 0 .5px 0 var(--line)}
.mact button:hover,.mact button:active{background:var(--hover)}
.mact .mi{display:grid;place-items:center;color:var(--muted)}
.mact .danger,.mact .danger .mi{color:#E53935}
#typingLine{height:24px;padding:0 20px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);background:var(--band);overflow:hidden;white-space:nowrap}
#typingLine .tb{display:inline-flex;gap:3px;align-items:center;background:var(--bubble);border-radius:10px;padding:5px 8px;animation:popIn .3s var(--spring)}
#typingLine .tb i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:tdot 1.2s infinite ease-in-out}
#typingLine .tb i:nth-child(2){animation-delay:.15s}#typingLine .tb i:nth-child(3){animation-delay:.3s}
#typingLine .tt{animation:fadeIn .2s}
#toBottom{position:absolute;right:18px;bottom:96px;width:38px;height:38px;border-radius:50%;border:none;background:var(--card);color:var(--title);box-shadow:0 4px 14px #06306a33;display:grid;place-items:center;padding:0;z-index:4;animation:popIn .25s var(--spring)}
#bar{display:flex;align-items:center;gap:10px;padding:8px 14px 4px 16px;background:var(--card);border-top:1px solid var(--line);font-size:13px;animation:barIn .24s var(--ease)}
#bar .bk{color:var(--blue-l);display:grid;place-items:center;flex-shrink:0}
#bar .bl{flex:1;min-width:0;border-left:2px solid var(--blue-l);padding-left:10px}
#bar .bt{color:var(--blue-l);font-weight:600;font-size:12px}
#bar .bx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
#bar img{width:40px;height:40px;object-fit:cover;border-radius:8px}
#bar button{width:26px;height:26px;border-radius:50%;border:none;background:var(--band);color:var(--muted);display:grid;place-items:center;padding:0;flex-shrink:0}
#form{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--line);background:var(--card);align-items:flex-end;padding-bottom:max(8px,env(safe-area-inset-bottom))}
#bar:not(.hidden)+#form{border-top:none}
.cbtn{width:38px;height:38px;border-radius:50%;border:none;background:var(--band);color:var(--title);display:grid;place-items:center;flex-shrink:0;padding:0;transition:transform .15s var(--spring),background .15s}
.cbtn:hover{background:var(--hover)}.cbtn:active{transform:scale(.9)}
.field{flex:1;min-width:0;display:flex;align-items:flex-end;gap:2px;border:1px solid var(--line);border-radius:20px;background:var(--card);padding:3px;transition:border-color .15s,box-shadow .15s}
.field:focus-within{border-color:#16419470;box-shadow:0 0 0 3px #16419414}
#text{flex:1;min-width:0;resize:none;max-height:150px;height:33px;padding:6px 4px 6px 11px;border:none;outline:none;background:none;line-height:1.4}
.fbtn{width:30px;height:30px;border-radius:50%;border:none;background:none;color:var(--muted);display:grid;place-items:center;padding:0;flex-shrink:0;transition:color .12s,transform .15s var(--spring)}
.fbtn:hover{color:var(--title)}.fbtn:active{transform:scale(.86)}
#send{width:30px;height:30px;border-radius:50%;border:none;background:var(--blue);color:#fff;display:grid;place-items:center;padding:0;flex-shrink:0;position:relative;overflow:hidden;opacity:0;transform:scale(.3);pointer-events:none;transition:transform .34s var(--spring),opacity .15s,background .15s}
.field.has #send{opacity:1;transform:none;pointer-events:auto}
.field.has #send:active{transform:scale(.85)}
#send:hover{background:#06306A}
.rip{position:absolute;border-radius:50%;background:#ffffff55;pointer-events:none;width:40px;height:40px;margin:-20px 0 0 -20px;animation:ripple .5s ease-out forwards}
.ann-list{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:6px}
.ann{background:var(--card);border-radius:16px;box-shadow:0 2px 10px #06306a12;border-left:4px solid var(--blue);padding:16px 18px;animation:fadeUp .35s var(--ease) both}
.ann.new{animation:popIn .4s var(--spring) both}
.ann-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ann-h .av{width:38px;height:38px;font-size:13px;cursor:pointer}
.ann-h .av.ceo::before{font-size:15px;top:-13px}
.ann-who{font-weight:600;color:var(--title);font-size:14px}
.ann-when{font-size:12px;color:var(--muted)}
.ann-tag{margin-left:auto;font-size:11px;font-weight:600;color:var(--blue-l);background:var(--band);padding:4px 10px;border-radius:20px}
.ann-t{white-space:pre-wrap;word-wrap:break-word;line-height:1.5}
.ann-del{border:none;background:none;color:var(--muted);font-size:13px;padding:4px 8px;border-radius:6px;margin-left:6px}
.ann-del:hover{background:#E5393518;color:#E53935}
.ann-intro{max-width:760px;margin:0 auto 4px;color:var(--muted);font-size:13px;text-align:center}
.load-more-btn{display:block;width:100%;padding:8px;border:none;background:var(--band);color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;border-radius:10px;margin-bottom:8px;transition:background .15s,color .15s}
.load-more-btn:hover{background:var(--hover);color:var(--title)}
.prof{max-width:560px;margin:0 auto 20px;background:var(--card);border-radius:18px;box-shadow:0 4px 20px #06306a14;overflow:hidden;animation:fadeUp .4s var(--ease) both}
.prof-top{background:linear-gradient(135deg,#06306A,#164194);padding:28px 24px 22px;color:#fff;display:flex;gap:16px;align-items:center}
.prof-top .av{width:72px;height:72px;font-size:26px;border:3px solid #ffffff40;overflow:visible}
.prof-top .av img{border-radius:50%}
@keyframes dotBlink{0%,100%{opacity:1}50%{opacity:.4}}
.prof-top .av.on::after{width:14px;height:14px;right:-2px;bottom:-2px;border:2.5px solid #fff;background:#2ECC71;box-shadow:0 1px 3px #0004;z-index:3;animation:dotBlink 2.6s ease-in-out infinite}
.prof-top .av.ceo::before{font-size:26px;top:-24px}
.prof-top .pn{font-family:Montserrat,sans-serif;font-size:20px;font-weight:700}
.prof-top .pp{opacity:.85;font-size:14px;margin-top:2px}
.prof-top .ps{opacity:.7;font-size:12px;margin-top:4px}
.prof-body{padding:18px 24px 24px}
.prof-body label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:14px 0 6px}
.prof-body .inp[readonly]{background:var(--band);color:var(--muted)}
.prof-line{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.prof-line .k{font-size:12px;color:var(--muted);width:90px;flex-shrink:0}
.prof-ok{font-size:13px;margin-top:10px;min-height:1.2em;text-align:center}
.seg{display:flex;background:var(--band);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:none;background:none;padding:8px;border-radius:8px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--title);font-weight:600;box-shadow:0 1px 3px #0002}
#lightbox{position:fixed;inset:0;background:#000d;z-index:50;display:grid;place-items:center;animation:fadeIn .2s}
#lightbox img{max-width:94vw;max-height:88vh;border-radius:8px;animation:popIn .3s var(--spring)}
#lightbox a{position:absolute;top:16px;right:70px;color:#fff;text-decoration:none;background:#fff2;padding:8px 14px;border-radius:10px;font-size:14px;display:flex;gap:7px;align-items:center}
#lightbox button{position:absolute;top:16px;right:16px;background:#fff2;border:none;color:#fff;width:40px;height:40px;border-radius:10px;display:grid;place-items:center}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#06306A;color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;z-index:60;box-shadow:0 8px 24px #0004;animation:fadeIn .25s}
#shade{display:none}
@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(6px) scale(.9)}to{opacity:1;transform:none}}
@keyframes fadeOut{to{opacity:0}}
@keyframes hl{0%,100%{transform:none}25%{transform:scale(1.045)}}
@keyframes ctxIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes barIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes tdot{0%,60%,100%{transform:none;opacity:.35}30%{transform:translateY(-3px);opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes ripple{to{transform:scale(2.6);opacity:0}}
@keyframes flash{0%,60%{box-shadow:0 0 0 4px #FFC10788}100%{box-shadow:0 1px 2px #06306a14}}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
@media(hover:none){.del{opacity:.6}.bubble{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}}
@media(max-width:760px){
  /* Мобильная версия как в WhatsApp/Telegram: список чатов → чат на весь экран */
  #side{position:fixed;inset:0;width:100%;z-index:20;background:var(--card);color:var(--text);transition:transform .32s var(--ease)}
  #app.chat #side{transform:translateX(-22%)}
  #main{position:fixed;inset:0;z-index:25;transform:translateX(100%);transition:transform .32s var(--ease);box-shadow:-10px 0 30px #06306a26}
  #app.chat #main{transform:none}
  #app.enter #main{animation:none}
  #shade{display:none!important}
  #menuBtn{display:grid;margin-left:-4px}
  #side .logo{background:var(--side);color:#fff;padding:12px 12px 12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
  #side .scroll{background:var(--card);display:flex;flex-direction:column}
  #side .scroll>*{flex-shrink:0}
  #findUser{order:-1}
  #side h3{color:var(--muted);margin:16px 16px 2px}
  #side h3 button{color:var(--muted)}
  #findUser{background:var(--band);color:var(--text);margin:10px 12px 2px;padding:10px 14px;border-radius:12px;font-size:15px;width:calc(100% - 24px)}
  #findUser::placeholder{color:var(--muted)}
  .item{margin:0;border-radius:0;padding:9px 14px;gap:12px;color:var(--text);min-height:70px;overflow:visible}
  .item::after{content:"";position:absolute;left:76px;right:0;bottom:0;height:1px;background:var(--line);opacity:.55}
  .item:hover,.item:active{background:var(--hover);color:var(--text)}
  .item:active{transform:none}
  .item.active{background:none;box-shadow:none;color:var(--text)}
  .item>.av,.item>.ic{width:50px;height:50px;font-size:18px}
  .item>.ic{opacity:1;border-radius:50%;background:#16419418;color:var(--blue)}
  [data-theme=dark] .item>.ic{color:#8FB0FF}
  .item>.av.on::after{width:13px;height:13px;border-color:var(--card)}
  .item .lbl{font-size:16px;font-weight:600;color:var(--title);padding-right:58px}
  .item .sub{font-size:14px;opacity:1;color:var(--muted);margin-top:3px;font-weight:400}
  .item.unread .sub{color:var(--text)}
  .item .tm{position:absolute;right:14px;top:15px;font-size:12px;color:var(--muted)}
  .item.unread .tm{color:var(--blue);font-weight:600}
  .item .badge{position:absolute;right:14px;top:37px;background:var(--blue)}
  .item .del{display:none}
  .chav{border-radius:50%;font-weight:700}
  #me{border-top:1px solid var(--line);background:var(--card);color:var(--text);padding-bottom:max(12px,env(safe-area-inset-bottom))}
  #me:hover,#me.active{background:var(--hover)}
  #me .av.on::after{border-color:var(--card)}
  #logout{background:var(--band);color:var(--text)}
  #side>.powered{display:none}
  .bwrap{max-width:82%}
  #msgs{padding:10px 10px 6px}
  #head{padding:8px 10px}
  #bell .t{display:none}
  #form{padding:6px 8px;gap:6px;padding-bottom:max(6px,env(safe-area-inset-bottom))}
  .cbtn{width:36px;height:36px}
  #typingLine{padding:0 12px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* Голосовые */
#field{position:relative}
#mic{position:absolute;right:3px;bottom:3px;width:30px;height:30px;border-radius:50%;border:none;background:none;color:var(--muted);display:grid;place-items:center;padding:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .3s var(--spring),opacity .15s,color .15s}
#mic:hover{color:var(--blue)}
.field.has #mic{opacity:0;transform:scale(.3);pointer-events:none}
#form{position:relative}
#rec{position:absolute;inset:0;z-index:5;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--card);padding-bottom:env(safe-area-inset-bottom);animation:fadeIn .15s;touch-action:none;-webkit-user-select:none;user-select:none}
#rec.hidden{display:none}
#rec .rdot{width:10px;height:10px;border-radius:50%;background:#E53935;flex-shrink:0;animation:recBlink 1s infinite}
#rec.paused .rdot{animation:none;opacity:.35}
#recTime{font-variant-numeric:tabular-nums;font-weight:600;color:var(--title);min-width:38px}
#recWave{flex:1;height:30px;display:flex;align-items:center;justify-content:flex-end;gap:2px;overflow:hidden;min-width:0}
#recWave i{display:block;width:3px;border-radius:2px;background:var(--blue-l);flex-shrink:0;animation:barIn .15s var(--ease)}
#rec.paused #recWave i{background:var(--muted)}
#recHint{position:absolute;left:50%;top:50%;transform:translate(calc(-50% + var(--dx,0px)),-50%);color:var(--muted);font-size:13px;white-space:nowrap;pointer-events:none;opacity:calc(1 + var(--dx,0px) / 120px)}
#rec.hold #recWave{visibility:hidden}
#rec.locked #recHint{display:none}
#rec .rbtn{width:38px;height:38px;border-radius:50%;border:none;background:none;color:var(--muted);display:grid;place-items:center;flex-shrink:0;padding:0;transition:color .15s,background .15s}
#rec .rbtn:hover{background:var(--band);color:var(--title)}
#recDel:hover{color:#E53935!important}
#rec.hold .rbtn{display:none}
#recSend{width:44px;height:44px;border-radius:50%;border:none;background:var(--blue);color:#fff;display:grid;place-items:center;flex-shrink:0;padding:0;box-shadow:0 4px 14px #16419455;transition:transform .3s var(--spring)}
#rec.hold #recSend{transform:scale(1.35) translateX(calc(var(--dx,0px) / 4));pointer-events:none}
#rec.hold.live #recSend{animation:micPulse 1.4s infinite}
#rec.bin{animation:recBin .38s var(--ease) forwards}
#recLock{position:absolute;right:16px;bottom:calc(100% + 14px);z-index:6;width:40px;padding:10px 0 8px;border-radius:22px;background:var(--card);box-shadow:0 6px 20px #06306a30;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;transform:translateY(var(--dy,0px));animation:fadeUp .25s var(--spring);pointer-events:none}
#recLock.hidden{display:none}
#recLock.done{color:var(--blue);transform:translateY(-20px) scale(.8);opacity:0;transition:all .25s}
#recLock .cu{animation:nudge 1.2s infinite}
@keyframes recBlink{50%{opacity:.25}}
@keyframes barIn{from{transform:scaleY(.2)}}
@keyframes micPulse{0%{box-shadow:0 0 0 0 #16419466}70%{box-shadow:0 0 0 16px #16419400}100%{box-shadow:0 0 0 0 #16419400}}
@keyframes recBin{to{opacity:0;transform:translateX(-30px)}}
@keyframes nudge{50%{transform:translateY(-3px)}}
.voice{display:flex;align-items:center;gap:8px;min-width:236px;max-width:300px;white-space:normal;padding:2px 0 0}
.vav{position:relative;flex-shrink:0}
.vav .av{width:42px;height:42px;font-size:14px}
.vav .av.on::after,.vav .av.ceo::before{display:none}
.vmic{position:absolute;right:-3px;bottom:-2px;width:18px;height:18px;border-radius:50%;background:var(--bubble);color:var(--muted);display:grid;place-items:center}
.row.mine .vmic{background:var(--mine);color:#ffffffaa}
.vmic.heard{color:#34B7F1!important}
.vplay{width:34px;height:34px;border:none;background:none;color:var(--muted);display:grid;place-items:center;padding:0;flex-shrink:0;transition:transform .15s var(--spring)}
.row.mine .vplay{color:#fff}
.vplay:active{transform:scale(.85)}
.vmid{flex:1;min-width:0}
.vwave{position:relative;height:26px;display:flex;align-items:center;gap:2px;cursor:pointer;touch-action:none}
.vwave i{flex:1;min-width:2px;max-width:3px;border-radius:2px;background:var(--line);transition:background .1s}
.vwave i.on{background:var(--blue-l)}
.row.mine .vwave i{background:#ffffff55}
.row.mine .vwave i.on{background:#fff}
.vknob{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--blue-l);left:0;opacity:0;transition:opacity .15s;pointer-events:none}
.voice.started .vknob,.voice:hover .vknob{opacity:1}
.row.mine .vknob{background:#fff}
.vinfo{display:flex;align-items:center;gap:6px;font-size:11px;opacity:.75;margin-top:1px}
.vtime{font-variant-numeric:tabular-nums}
.vspeed{display:none;border:none;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:700;background:var(--band);color:var(--title)}
.row.mine .vspeed{background:#ffffff30;color:#fff}
.voice.started .vspeed{display:inline-block}
.vid{display:block;max-width:min(320px,100%);max-height:360px;border-radius:12px;margin:2px 0 4px;background:#000}
/* Меню вложений */
.amenu{position:fixed;z-index:30;background:var(--card);border-radius:16px;box-shadow:0 12px 40px #06306a33;padding:8px;display:flex;flex-direction:column;min-width:200px;animation:popIn .22s var(--spring) both;transform-origin:left bottom}
.amenu button{display:flex;align-items:center;gap:12px;border:none;background:none;padding:8px 12px 8px 8px;border-radius:10px;color:var(--text);font-size:14px;font-weight:500;text-align:left;transition:background .12s}
.amenu button:hover{background:var(--hover)}
.amenu .aic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;flex-shrink:0}
/* Модалка и опрос */
.modal{position:fixed;inset:0;z-index:50;background:#06306a66;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .18s}
.modal.out{opacity:0;transition:opacity .18s}
.mcard{background:var(--card);border-radius:18px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px #06306a44;animation:popIn .28s var(--spring) both}
.mh{font-family:Montserrat,sans-serif;font-weight:700;font-size:17px;color:var(--title);margin-bottom:14px}
.mlbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:14px 0 6px}
.mcard .inp{margin:0}
.popts{display:flex;flex-direction:column;gap:6px}
.popt{display:flex;gap:6px;align-items:center}
.popt .px{width:32px;height:32px;border:none;background:none;color:var(--muted);border-radius:8px;display:grid;place-items:center;flex-shrink:0}
.popt .px:hover{background:var(--band);color:#E53935}
.ckg-editor{display:flex;flex-direction:column;gap:10px}
.ckg-card{border:1px solid var(--line);border-radius:12px;padding:10px}
.ckg-chead{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.ckg-tin{flex:1;min-width:0}
.ckg-chead .px{width:30px;height:30px;flex-shrink:0}
.ptog{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px;cursor:pointer;color:var(--text)}
.ptog input{display:none}
.ptog .sw{width:36px;height:20px;border-radius:10px;background:var(--line);position:relative;flex-shrink:0;transition:background .2s}
.ptog .sw::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:transform .25s var(--spring)}
.ptog input:checked+.sw{background:var(--blue)}
.ptog input:checked+.sw::after{transform:translateX(16px)}
.macts{display:flex;gap:10px;margin-top:18px}
.macts .btn{margin:0;flex:1}
.poll{min-width:240px;max-width:320px;width:100%;box-sizing:border-box;white-space:normal;padding:2px 0;overflow:hidden}
.poll .ph{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;opacity:.7;text-transform:uppercase;letter-spacing:.5px}
.poll .pq{font-weight:600;font-size:15px;margin:4px 0 8px;line-height:1.35}
.po{display:block;width:100%;border:none;background:none;padding:6px 0;text-align:left;color:inherit;font:inherit;position:relative;cursor:pointer}
.po:disabled{cursor:default}
.prow{display:flex;align-items:center;gap:8px;font-size:14px;max-width:100%}
.pck{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex-shrink:0;color:transparent;transition:all .2s var(--spring)}
.pck.sq{border-radius:6px}
.po.on .pck{background:var(--blue-l);border-color:var(--blue-l);color:#fff}
.row.mine .pck{border-color:#ffffff80}
.row.mine .po.on .pck{background:#fff;border-color:#fff;color:var(--mine)}
.pt{flex:1;min-width:0;overflow-wrap:break-word}
.pp{font-size:12px;font-weight:600;opacity:.8;flex-shrink:0;white-space:nowrap;text-align:right}
.pavs{display:flex;flex-shrink:0}
.pavs .av{width:18px;height:18px;font-size:8px;margin-left:-5px;border:1.5px solid var(--bubble)}
.pavs .av.on::after,.pavs .av.ceo::before{display:none}
.pb{display:block;height:4px;border-radius:2px;background:var(--blue-l);margin:5px 0 0 28px;width:0;transition:width .5s var(--ease);opacity:.85}
.po:not(.lead) .pb{opacity:.45}
.row.mine .pb{background:#fff}
.pf{font-size:12px;opacity:.7;margin-top:6px}
.poll.closed .pq{opacity:.8}
/* Лента */
#msgs.feed{padding-top:18px}
#msgs.feed>*{max-width:680px;margin-left:auto;margin-right:auto}
.feed-top{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.compose{background:var(--card);border-radius:16px;box-shadow:0 2px 10px #06306a12;overflow:hidden}
.cp-top{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:text}
.cp-top .av{width:38px;height:38px;font-size:13px}
.cp-ph{flex:1;padding:10px 14px;border-radius:20px;background:var(--band);color:var(--muted);font-size:14px}
.compose.open .cp-top{display:none}
.cp-body{display:none;padding:12px 16px 14px}
.compose.open .cp-body{display:block;animation:fadeUp .25s var(--ease)}
.cp-tabs{display:flex;gap:4px;overflow-x:auto;margin:-2px -4px 10px;padding:0 4px;scrollbar-width:none}
.cp-tab{display:flex;align-items:center;gap:6px;border:none;background:none;padding:7px 12px;border-radius:18px;color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap;transition:background .15s,color .15s}
.cp-tab:hover{background:var(--band);color:var(--title)}
.cp-tab.on{background:#16419418;color:var(--blue)}
[data-theme=dark] .cp-tab.on{color:#8FB0FF}
.compose[data-kind=important] .cp-tab.on{background:#F2A90022;color:#B47A00}
.compose[data-kind=thanks] .cp-tab.on{background:#E5467A1c;color:#C2185B}
.cp-tx{width:100%;border:none;outline:none;resize:none;background:none;color:var(--text);font:inherit;font-size:15px;line-height:1.5;min-height:72px;padding:4px 0}
.compose[data-kind=important] .cp-tx{border-left:3px solid #F2A900;padding-left:10px}
.cp-prev{display:flex;flex-wrap:wrap;gap:6px}
.cp-att{display:flex;align-items:center;gap:8px;background:var(--band);border-radius:10px;padding:5px 6px 5px 5px;font-size:13px;max-width:100%;cursor:default}
.cp-att img{width:40px;height:40px;object-fit:cover;border-radius:7px}
.cp-att span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.cp-foot{display:flex;align-items:center;gap:4px;border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.cp-ic{width:36px;height:36px;border-radius:50%;border:none;background:none;color:var(--muted);display:grid;place-items:center;padding:0}

.cp-cancel{border:none;background:none;color:var(--muted);font-weight:600;padding:8px 12px;border-radius:10px}

.cp-badge.on{border-color:#E5467A;background:#E5467A12;color:#C2185B}
.cp-to{display:flex;flex-wrap:wrap;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;padding:6px 8px;cursor:text}

.cp-tou{display:flex;align-items:center;gap:5px;background:#16419414;border-radius:14px;padding:2px 2px 2px 3px;font-size:13px;font-weight:500}
.cp-tou .av,.cp-s .av{width:22px;height:22px;font-size:9px}
.cp-tou .av.on::after,.cp-s .av.on::after,.cp-tou .av.ceo::before,.cp-s .av.ceo::before{display:none}
.cp-toin{flex:1;min-width:120px;border:none;outline:none;background:none;color:var(--text);font:inherit;font-size:14px;padding:4px}
.cp-sug{border:1px solid var(--line);border-radius:12px;margin-top:6px;overflow:hidden;background:var(--card)}
.cp-s{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;font-size:14px}
.cp-s:hover{background:var(--hover)}
.cp-s .sub{color:var(--muted);font-size:12px;margin-left:auto}
.ffilters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.ff{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:18px;padding:6px 14px;font-size:13px;font-weight:600;white-space:nowrap;transition:all .15s}
.ff:hover{color:var(--title)}
.ff.on{background:var(--blue);border-color:var(--blue);color:#fff}
.post{background:var(--card);border-radius:16px;box-shadow:0 2px 10px #06306a12;padding:14px 16px 6px;margin-bottom:12px;animation:fadeUp .35s var(--ease) both;position:relative}
.post.new{animation:popIn .4s var(--spring) both}
.post.k-important,.post.k-ann{box-shadow:inset 4px 0 0 #F2A900,0 2px 10px #06306a12}
.post.k-ann{padding-bottom:14px}
.post.pinned{box-shadow:inset 0 0 0 2px #16419440,0 2px 10px #06306a12}
.ppin{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--blue-l);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.post-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.post-h .av{width:40px;height:40px;font-size:14px;cursor:pointer}
.pwho{flex:1;min-width:0}
.pnm{font-weight:600;color:var(--title);font-size:14px;cursor:pointer}
.pnm:hover{text-decoration:underline}
.pdt{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:var(--band);color:var(--blue-l);white-space:nowrap}
.k-important .ptag,.k-ann .ptag{background:#F2A90022;color:#B47A00}
.k-thanks .ptag{background:#E5467A18;color:#C2185B}
.k-poll .ptag{background:#E8A30018;color:#9A6C00}
[data-theme=dark] .k-important .ptag,[data-theme=dark] .k-ann .ptag,[data-theme=dark] .k-poll .ptag{color:#F2C14E}
[data-theme=dark] .k-thanks .ptag{color:#FF8AB1}
.pmore{width:32px;height:32px;border:none;background:none;color:var(--muted);border-radius:50%;display:grid;place-items:center;padding:0;flex-shrink:0}
.pmore:hover{background:var(--band);color:var(--title)}
.post-t{white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;line-height:1.55;font-size:15px}
.post-t.clamp{max-height:9.3em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent)}
.tmore{border:none;background:none;color:var(--blue-l);font-weight:600;padding:4px 0;font-size:14px}
.pimg{display:block;max-width:100%;max-height:480px;border-radius:12px;margin:10px 0 4px;cursor:zoom-in}
.post .vid{max-width:100%;margin-top:10px}
.post .filecard{margin-top:10px}
.post .poll{max-width:none;margin-top:8px;background:var(--band);border-radius:12px;padding:12px 14px}
.thx{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#E5467A14,#F2A90018);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.thx-e{font-size:40px;line-height:1;animation:popIn .5s var(--spring) both}
.thx-t{font-family:Montserrat,sans-serif;font-weight:700;font-size:17px;color:var(--title);margin-bottom:6px}
.thx-who{display:flex;flex-wrap:wrap;gap:6px}
.thx-u{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:16px;padding:2px 10px 2px 2px;font-size:13px;font-weight:600;cursor:pointer}
.thx-u .av{width:24px;height:24px;font-size:9px}
.thx-u .av.on::after,.thx-u .av.ceo::before{display:none}
.imp{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.imp-b{border:none;background:#F2A900;color:#1d1d1d;font-weight:700;padding:8px 16px;border-radius:10px;font-size:13px;transition:transform .15s var(--spring)}
.imp-b:active{transform:scale(.95)}
.imp-b.on{background:var(--band);color:var(--muted);cursor:default}
.imp-n{font-size:12px;color:var(--muted);cursor:help}
.post .reacts{margin-top:10px}
.pbar{display:flex;gap:2px;border-top:1px solid var(--line);margin-top:10px;padding-top:4px}
.pact{display:flex;align-items:center;gap:6px;border:none;background:none;color:var(--muted);font-weight:600;font-size:13px;padding:8px 10px;border-radius:10px;transition:background .12s,color .12s}
.pact:hover{background:var(--band);color:var(--title)}
.pact.on{color:var(--blue)}
[data-theme=dark] .pact.on{color:#8FB0FF}
.pact.on svg{fill:currentColor;fill-opacity:.18}
.cmts{border-top:1px solid var(--line);margin:4px -16px 0;padding:8px 16px 10px;background:color-mix(in srgb,var(--band) 45%,transparent);border-radius:0 0 16px 16px}
.cmore{border:none;background:none;color:var(--blue-l);font-weight:600;font-size:13px;padding:4px 0 8px}
.cm{display:flex;gap:8px;margin-bottom:8px;animation:fadeUp .25s var(--ease)}
.cm .av,.cin .av{width:30px;height:30px;font-size:11px;flex-shrink:0;cursor:pointer}
.cm .av.on::after,.cin .av.on::after{width:8px;height:8px}
.cb{background:var(--card);border-radius:4px 14px 14px 14px;padding:6px 30px 7px 11px;position:relative;min-width:0;max-width:100%}
.ch{display:flex;gap:8px;align-items:baseline;font-size:12px}
.ch b{color:var(--title);font-size:13px}
.ch span{color:var(--muted)}
.ct{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.45}
.cdel{position:absolute;top:4px;right:4px;width:22px;height:22px;border:none;background:none;color:var(--muted);border-radius:50%;display:grid;place-items:center;padding:0;opacity:0;transition:opacity .15s}
.cb:hover .cdel{opacity:1}
@media (hover:none){.cdel{opacity:.6}}
.cin{display:flex;align-items:flex-end;gap:8px}
.cin textarea{flex:1;min-width:0;border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--text);font:inherit;font-size:14px;padding:7px 14px;resize:none;outline:none;line-height:1.4;transition:border-color .15s}
.cin textarea:focus{border-color:#16419470}
.csend{width:34px;height:34px;border-radius:50%;border:none;background:var(--blue);color:#fff;display:grid;place-items:center;padding:0;flex-shrink:0;opacity:0;transform:scale(.4);pointer-events:none;transition:transform .3s var(--spring),opacity .15s}
.cin.has .csend{opacity:1;transform:none;pointer-events:auto}
.pmenu{position:fixed;z-index:30;background:var(--card);border-radius:12px;box-shadow:0 10px 30px #06306a33;padding:6px;min-width:190px;animation:popIn .18s var(--spring) both}
.pmenu button{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;padding:9px 12px;border-radius:8px;color:var(--text);font-size:14px;text-align:left}
.pmenu button:hover{background:var(--hover)}
.pmenu .danger{color:#E53935}
.pmenu .mi{display:grid;place-items:center;color:var(--muted)}
.pmenu .danger .mi{color:#E53935}
#toBottom .cnt{position:absolute;top:-6px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--blue);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
@media (max-width:760px){.post{border-radius:14px;padding:12px 12px 4px}.cmts{margin:4px -12px 0;padding:8px 12px 10px}#msgs.feed{padding-left:10px;padding-right:10px}.voice{min-width:210px}}

/* Задачи */
#msgs.tasks{padding:16px 20px 20px}
.tk-top{max-width:1100px;margin:0 auto 12px;display:flex;flex-direction:column;gap:10px}

.tk-add:active{transform:scale(.95)}
.tk-search{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:9px 14px;font:inherit;font-size:14px;outline:none}
.tk-search:focus{border-color:#16419470}
.tk-view{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.tk-view button{border:none;background:none;color:var(--muted);font-weight:600;font-size:13px;padding:6px 12px;border-radius:7px}
.tk-view button.on{background:var(--blue);color:#fff}
.tk-r2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tk-roles{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tk-role{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:18px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.tk-role b{font-size:11px;background:var(--band);color:var(--muted);border-radius:9px;padding:0 6px;min-width:18px;text-align:center}

.tk-role.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tk-role.on b{background:#ffffff30;color:#fff}
.tk-done{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tk-list{max-width:1100px;margin:0 auto;background:var(--card);border-radius:14px;box-shadow:0 2px 10px #06306a12;overflow:hidden}
.tk-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s;animation:fadeUp .3s var(--ease) both}
.tk-row:last-child{border-bottom:none}
.tk-row:hover{background:var(--hover)}
.tk-row.late{box-shadow:inset 3px 0 0 #E53935}
.tk-dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:grid;place-items:center;color:#fff}
.tk-dot.s-progress{border-color:#2E7D32;box-shadow:inset 0 0 0 3px var(--card);background:#2E7D32}

.tk-main{flex:1;min-width:0}
.tk-title{font-weight:600;color:var(--title);font-size:15px;display:flex;gap:4px;align-items:baseline;overflow-wrap:anywhere}
.tk-row.s-done .tk-title span:last-child{text-decoration:line-through;opacity:.6}
.tk-fire{flex-shrink:0}
.tk-sub{display:flex;align-items:center;gap:10px;margin-top:4px;flex-wrap:wrap}
.tk-st{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--band);color:var(--muted);white-space:nowrap}
.tk-st.s-progress{background:#2E7D3218;color:#2E7D32}
.tk-st.s-review{background:#E8A30020;color:#9A6C00}
.tk-st.s-done{background:#2E7D3218;color:#2E7D32}
.tk-st.s-defer{background:var(--band);color:var(--muted)}
.tk-st.s-new{background:#16419414;color:var(--blue)}
[data-theme=dark] .tk-st.s-new{color:#8FB0FF}
[data-theme=dark] .tk-st.s-review{color:#F2C14E}
[data-theme=dark] .tk-st.s-progress,[data-theme=dark] .tk-st.s-done{color:#6FCF7A}
.tk-meta{display:flex;gap:10px;font-size:12px;color:var(--muted)}
.tk-meta span{display:inline-flex;align-items:center;gap:3px}
.tk-meta .full{color:#2E7D32}
.tk-dl{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;padding:3px 8px;border-radius:8px;background:var(--band)}
.tk-dl.none{background:none;font-weight:400;opacity:.7}
.tk-dl.soon{background:#E8A30020;color:#9A6C00}
.tk-dl.late{background:#E5393518;color:#E53935}
.tk-dl.ok{color:#2E7D32;background:#2E7D3214}
.tk-who{display:flex;align-items:center;gap:6px;width:170px;flex-shrink:0;font-size:13px;color:var(--text);min-width:0}
.tk-who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-who .av,.kb-ft .av{width:26px;height:26px;font-size:10px}
.tk-who .av.on::after,.kb-ft .av.on::after,.tk-who .av.ceo::before,.kb-ft .av.ceo::before{display:none}
.tk-empty{padding:50px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.tk-empty-ic{width:64px;height:64px;border-radius:50%;background:var(--band);color:var(--blue);display:grid;place-items:center;font-size:30px;font-weight:700}
.tk-empty-t{color:var(--muted)}
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start;min-height:60vh}
.kb-col{flex:1 0 170px;min-width:0;background:color-mix(in srgb,var(--card) 55%,transparent);border-radius:14px;padding:10px;border-top:4px solid var(--line);transition:background .15s}
.kb-col.s-new{border-top-color:var(--blue)}.kb-col.s-progress{border-top-color:#2E7D32}.kb-col.s-review{border-top-color:#E8A300}.kb-col.s-defer{border-top-color:var(--muted)}.kb-col.s-done{border-top-color:#2E7D32;opacity:.85}
.kb-col.over{background:#16419418}
.kb-h{display:flex;align-items:center;gap:8px;padding:2px 4px 10px;font-weight:700;color:var(--title);font-size:13px}
.kb-t{flex:1}
.kb-n{font-size:12px;background:var(--band);color:var(--muted);border-radius:10px;padding:1px 8px}
.kb-cards{display:flex;flex-direction:column;gap:8px;min-height:40px}
.kb-card{background:var(--card);border-radius:10px;padding:10px 12px;box-shadow:0 1px 4px #06306a14;cursor:pointer;transition:transform .15s,box-shadow .15s;animation:fadeUp .3s var(--ease) both}
.kb-card:hover{box-shadow:0 4px 14px #06306a22;transform:translateY(-1px)}
.kb-card.drag{opacity:.4}
.kb-card.late{box-shadow:inset 3px 0 0 #E53935,0 1px 4px #06306a14}
.kb-card .tk-title{font-size:14px}
.kb-ft{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.kb-ft .av{margin-left:auto}.kb-card .tk-dl{white-space:normal;max-width:100%}
.kb-empty{font-size:12px;color:var(--muted);text-align:center;padding:14px 0;border:1px dashed var(--line);border-radius:10px}
#taskPanel{position:fixed;inset:0;z-index:45;display:flex;justify-content:flex-end}
#taskPanel .tp-shade{position:absolute;inset:0;background:#06306a44;animation:fadeIn .2s}
#taskPanel .tp{position:relative;width:min(620px,100%);height:100%;background:var(--card);display:flex;flex-direction:column;box-shadow:-10px 0 40px #06306a33;animation:tpIn .3s var(--ease) both}
#taskPanel.out .tp{animation:tpOut .22s var(--ease) forwards}#taskPanel.out .tp-shade{opacity:0;transition:opacity .2s}

.tp-x.danger:hover{color:#E53935}
.tp-body{flex:1;overflow-y:auto;padding:16px 20px 20px}
.tp-tags{display:flex;gap:6px;flex-wrap:wrap}

.tk-tag.late{background:#E5393518;color:#E53935}

.tp-ck:hover{background:var(--hover)}
.tp-ck.ro{cursor:default}.tp-ck.ro:hover{background:none}
.tp-box{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex-shrink:0;display:grid;place-items:center;color:transparent;transition:all .2s var(--spring)}
.tp-ck.on .tp-box{background:#2E7D32;border-color:#2E7D32;color:#fff}
.tp-ck .t{flex:1;min-width:0;overflow-wrap:break-word}
.tp-ck.on .t{text-decoration:line-through;opacity:.6}
.tp-ckdel{opacity:0;border:none;background:none;color:var(--muted);width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex-shrink:0}
.tp-ck:hover .tp-ckdel{opacity:.7}.tp-ckdel:hover{opacity:1!important;background:var(--band);color:#E53935}
.tp-none{color:var(--muted);font-size:13px;padding:4px 0 8px}
.ckgrp{margin-bottom:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ckgrp-h{display:flex;align-items:center;gap:6px;padding:8px 6px 8px 2px;background:var(--band)}
.ckgrp-chev{border:none;background:none;color:var(--muted);width:26px;height:26px;flex-shrink:0;display:grid;place-items:center;border-radius:6px;transition:transform .2s var(--ease)}
.ckgrp-chev:hover{background:var(--hover)}
.ckgrp-chev.open{transform:rotate(0deg)}.ckgrp-chev:not(.open){transform:rotate(-90deg)}
.ckgrp-title{flex:1;min-width:0;font-weight:600;font-size:13.5px;color:var(--title);cursor:text;padding:3px 6px;border-radius:6px;overflow-wrap:break-word}
.ckgrp-title:hover{background:var(--hover)}
.ckgrp-in{flex:1;min-width:0;font-weight:600;font-size:13.5px;padding:3px 6px;border-radius:6px;border:1.5px solid var(--blue-l);background:var(--card);color:var(--title)}
.ckgrp-cnt{font-size:12px;color:var(--muted);flex-shrink:0;padding:0 4px}
.ckgrp-del{border:none;background:none;color:var(--muted);width:24px;height:24px;flex-shrink:0;display:grid;place-items:center;border-radius:6px;opacity:0;transition:opacity .15s}
.ckgrp-h:hover .ckgrp-del{opacity:.6}.ckgrp-del:hover{opacity:1!important;background:var(--hover);color:#E53935}
.ckgrp-list{padding:4px 8px 8px;animation:slideUpIn .22s var(--ease) both}
.ckgrp-list.hidden{display:none}
.ckgrp-add{padding:2px 4px}
.ckgrp-add .inp{border:none;background:none;padding:6px 4px;font-size:13.5px;color:var(--muted)}
.ckgrp-add .inp:focus{color:var(--text)}
.ckgrp-addbtn{display:flex;align-items:center;gap:6px;border:1px dashed var(--line);background:none;color:var(--blue-l);font-size:13.5px;font-weight:600;padding:8px 10px;border-radius:10px;width:100%;justify-content:center;margin-top:2px}
.ckgrp-addbtn:hover{background:var(--hover)}
.tp-hist{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.tp-hist summary{cursor:pointer;font-weight:600;padding:4px 0}
.tp-lg{padding:4px 0}
.tp-lg b{color:var(--text);font-weight:600}
.tp-cin{display:flex;align-items:flex-end;gap:8px;padding:10px 16px;border-top:1px solid var(--line);padding-bottom:max(10px,env(safe-area-inset-bottom))}
.tp-cin .av{width:30px;height:30px;font-size:11px}
.tp-cin .av.on::after{display:none}
.tp-cin textarea{flex:1;min-width:0;border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--text);font:inherit;font-size:14px;padding:8px 14px;resize:none;outline:none;line-height:1.4}
.tp-cin.has .csend{opacity:1;transform:none;pointer-events:auto}
.tp-body .cm .av{width:30px;height:30px}
.tp-body .cb{background:var(--band)}
.tk-dlg{max-width:520px}
.tk-in-title{font-size:16px;font-weight:600}
.tk-in-desc{margin-top:8px!important;resize:vertical;font:inherit;min-height:70px}
.mcard select.inp{appearance:auto}
.tk-aud{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tk-audsel{border:1px dashed var(--line);background:none;color:var(--blue-l);border-radius:14px;padding:5px 10px;font:inherit;font-size:13px;max-width:100%}
.tk-pres{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tk-pres button{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:14px;padding:4px 10px;font-size:12px;font-weight:600}
.tk-pres button:hover{color:var(--title);border-color:var(--blue)}
@media (max-width:760px){
  #msgs.tasks{padding:10px 10px 16px}
  .tk-r1{flex-wrap:wrap}.tk-add{order:0}.tk-view{margin-left:auto}.tk-search{order:3;flex-basis:100%}
  .tk-done{display:none}
  .tk-row{flex-wrap:wrap;padding:12px;gap:8px 10px}
  .tk-main{flex-basis:calc(100% - 30px)}
  .tk-row .tk-dl{margin-left:28px}
  .tk-who{width:auto;margin-left:auto}
  .tk-who span{display:none}
  .kanban{scroll-snap-type:x mandatory;margin:0 -10px;padding:0 10px 10px}
  .kb-col{flex-basis:82vw;scroll-snap-align:center}
  #taskPanel .tp{width:100%}
  .tp-k{width:110px}
}

/* ===== Motion: короткие мягкие переходы (только opacity/transform — не нагружают телефон) ===== */
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes slideUpIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes popOut{to{opacity:0;transform:scale(.94)}}
@keyframes fadeOutQ{to{opacity:0}}
@keyframes badgePop{0%{transform:scale(.3)}55%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px) scale(.96)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,8px) scale(.97)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes rowNew{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
#msgs.switch{animation:viewIn .32s var(--ease)}
.badge{animation:badgePop .38s var(--spring)}
#toast{animation:toastIn .34s var(--spring) both}
#toast.out{animation:toastOut .22s ease forwards}
.pop.out,.amenu.out,.pmenu.out,.tapback.out,.mact.out{animation:popOut .16s ease forwards!important;pointer-events:none}
#ctxShade.out,#lightbox.out{animation:fadeOutQ .18s ease forwards;pointer-events:none}
.modal.out .mcard{animation:popOut .18s ease forwards}
.amenu button{animation:slideUpIn .28s var(--ease) both}
.amenu button:nth-child(2){animation-delay:.03s}.amenu button:nth-child(3){animation-delay:.06s}.amenu button:nth-child(4){animation-delay:.09s}
.pmenu button{animation:slideUpIn .24s var(--ease) both}
.tk-row,.kb-card{animation:none}
.tk-list.enter .tk-row,.kanban.enter .kb-card{animation:slideUpIn .34s var(--ease) both}
.tk-list.enter .tk-row:nth-child(2),.kanban.enter .kb-card:nth-child(2){animation-delay:.03s}
.tk-list.enter .tk-row:nth-child(3),.kanban.enter .kb-card:nth-child(3){animation-delay:.06s}
.tk-list.enter .tk-row:nth-child(4),.kanban.enter .kb-card:nth-child(4){animation-delay:.09s}
.tk-list.enter .tk-row:nth-child(5),.kanban.enter .kb-card:nth-child(5){animation-delay:.12s}
.tk-list.enter .tk-row:nth-child(6){animation-delay:.15s}.tk-list.enter .tk-row:nth-child(7){animation-delay:.18s}.tk-list.enter .tk-row:nth-child(n+8){animation-delay:.2s}
.kanban.enter .kb-col{animation:slideUpIn .34s var(--ease) both}
.kanban.enter .kb-col:nth-child(2){animation-delay:.04s}.kanban.enter .kb-col:nth-child(3){animation-delay:.08s}.kanban.enter .kb-col:nth-child(4){animation-delay:.12s}.kanban.enter .kb-col:nth-child(5){animation-delay:.16s}
.tk-row.fresh,.kb-card.fresh{animation:rowNew .45s var(--ease) both}
.tk-st{transition:background .25s,color .25s}
.tk-st.bump{animation:bump .4s var(--spring)}
.tp-ck .tp-box{transition:background .2s,border-color .2s,transform .25s var(--spring)}
.tp-ck:active .tp-box{transform:scale(.85)}
.tp-act,.tk-add,.tk-role,.ff,.cp-tab,.tk-view button,.pact,.cp-pub,.imp-b,.tk-pres button,.cp-badge{transition:transform .18s var(--spring),background .18s,color .18s,border-color .18s}
.tp-act:active,.tk-add:active,.tk-role:active,.ff:active,.cp-tab:active,.tk-view button:active,.pact:active,.tk-pres button:active,.cp-badge:active{transform:scale(.95)}
.item{transition:background .18s,color .18s,transform .15s,box-shadow .25s}
.item .ic{transition:transform .25s var(--spring)}
@media(hover:hover){.item:hover .ic{transform:scale(1.08)}.post:hover{box-shadow:0 6px 22px #06306a1c}}
.post{transition:box-shadow .25s}
.tp-body>*{animation:slideUpIn .3s var(--ease) both}
.tp-body>*:nth-child(2){animation-delay:.03s}.tp-body>*:nth-child(3){animation-delay:.06s}.tp-body>*:nth-child(4){animation-delay:.09s}.tp-body>*:nth-child(n+5){animation-delay:.12s}
.tp-body.still>*,.tp-body.still .cm{animation:none}
.tp-body.still .cm.fresh{animation:slideUpIn .3s var(--ease) both}
.cmts .cm{animation:none}
.cmts .cm.fresh{animation:slideUpIn .3s var(--ease) both}
::view-transition-old(root),::view-transition-new(root){animation-duration:.35s;animation-timing-function:ease}

/* Tour */
#tourOverlay{position:fixed;inset:0;z-index:9000;pointer-events:none}
.tour-backdrop{position:fixed;inset:0;background:#06306a88;backdrop-filter:blur(1px);z-index:9001;pointer-events:auto}
.tour-box{position:fixed;z-index:9002;background:var(--card);border-radius:16px;box-shadow:0 20px 60px #06306a44;padding:20px 22px 18px;max-width:300px;pointer-events:auto;animation:popIn .35s var(--spring) both}
.tour-box h4{margin:0 0 8px;font-family:Montserrat,sans-serif;font-weight:700;font-size:16px;color:var(--title)}
.tour-box p{margin:0 0 14px;font-size:14px;line-height:1.5;color:var(--text)}
.tour-hl{position:fixed;z-index:9002;border-radius:12px;box-shadow:0 0 0 4px #164194,0 0 0 9999px #06306a88;pointer-events:none;transition:all .35s var(--ease)}
.tour-arrow{position:absolute;width:12px;height:12px;background:var(--card);transform:rotate(45deg)}
.tour-footer{display:flex;align-items:center;gap:8px;flex-wrap:wrap}@media(max-width:760px){.tour-dots{flex-basis:100%;order:-1;margin-bottom:6px}}
.tour-dots{flex:1;display:flex;gap:5px}
.tour-dot{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .2s}
.tour-dot.on{background:var(--blue)}
.tour-btn{white-space:nowrap;padding:7px 16px;border-radius:8px;border:none;background:var(--blue);color:#fff;font-weight:600;font-size:13px;cursor:pointer}
.tour-btn.skip{background:var(--band);color:var(--muted);margin-right:auto}
</style>

}

    { sel: "#findUser", title: "🔍 Поиск коллег", text: "Начните вводить имя — список мгновенно фильтруется.", pos: "right" },
    { sel: "#searchBtn", title: "🔎 Поиск в чате", text: "Ищите конкретное сообщение в открытом канале или диалоге.", pos: "bottom" },
    { sel: "#themeBtn", title: "🌙 Тема", text: "Переключайтесь между светлой и тёмной темой в любой момент.", pos: "bottom" },
    { sel: "#form", title: "✉️ Отправка", text: "Пишите сообщения, записывайте голосовые (удерживайте 🎤), прикрепляйте фото, видео, файлы и создавайте опросы через скрепку. Длинный тап по сообщению — реакции, ответ, удаление.", pos: "top" },
    { sel: "#me", title: "👤 Мой профиль", text: "Ваше имя, должность и фото. Нажмите, чтобы заполнить профиль — коллеги увидят ваши данные.", pos: "top" },
  ];
  STEPS = STEPS.filter(x => { const e = document.querySelector(x.sel); if (!e) return false; const r = e.getBoundingClientRect(); return r.width > 0 && r.left >= 0 && r.right <= innerWidth + 1; });
  if (!STEPS.length) return;
  let step = 0;
  const ov = el("div"); ov.id = "tourOverlay"; document.body.append(ov);
  const bd = el("div", "tour-backdrop"); ov.append(bd);
  const hl = el("div", "tour-hl"); ov.append(hl);
  const box = el("div", "tour-box"); ov.append(box);
  function render(i) {
    const s = STEPS[i];
    const target = document.querySelector(s.sel);
    box.innerHTML = "";
    const h = el("h4", null, s.title); box.append(h);
    const p = el("p", null, s.text); box.append(p);
    const foot = el("div", "tour-footer");
    const skipBtn = el("button", "tour-btn skip", "Пропустить");
    skipBtn.onclick = closeTour;
    const dots = el("div", "tour-dots");
    STEPS.forEach((_, j) => { const d = el("div", "tour-dot" + (j === i ? " on" : "")); dots.append(d); });
    const nextBtn = el("button", "tour-btn", i < STEPS.length - 1 ? "Далее →" : "Готово!");
    nextBtn.onclick = () => { if (i < STEPS.length - 1) render(i + 1); else closeTour(); };
    foot.append(skipBtn, dots, nextBtn);
    box.append(foot);
    if (!target) { hl.style.display = "none"; box.style.cssText = "top:50%;left:50%;transform:translate(-50%,-50%)"; return; }
    const r = target.getBoundingClientRect();
    hl.style.cssText = `left:${r.left - 6}px;top:${r.top - 6}px;width:${r.width + 12}px;height:${r.height + 12}px;display:block`;
    const bw = 300, bh = 200;
    let bx, by;
    if (s.pos === "right") { bx = Math.min(r.right + 16, window.innerWidth - bw - 12); by = Math.max(8, Math.min(r.top, window.innerHeight - bh - 12)); }
    else if (s.pos === "top") { bx = Math.max(8, Math.min(r.left, window.innerWidth - bw - 12)); by = Math.max(8, r.top - bh - 16); }
    else { bx = Math.max(8, Math.min(r.left, window.innerWidth - bw - 12)); by = Math.min(r.bottom + 16, window.innerHeight - bh - 12); }
    box.style.cssText = `left:${bx}px;top:${by}px`;
  }
  function closeTour() { ov.remove(); store.set("oc-tour", "done"); }
  bd.onclick = closeTour;
  render(0);
}
function maybeShowTour() { if (!store.get("oc-tour")) setTimeout(showTour, 1200); }

/* ---------- разное ---------- */
$("menuBtn").onclick = () => { if (isMob()) { if (history.state && history.state.oc) history.back(); else goList(); } else $("side").classList.toggle("open"); };
setBackIcon();
$("shade").onclick = () => $("side").classList.remove("open");
document.addEventListener("pointerdown", e => {
  const b = e.target.closest(".btn,#send,.item"); if (!b) return;
  const r = b.getBoundingClientRect(), s = el("span", "rip");
  s.style.left = (e.clientX - r.left) + "px"; s.style.top = (e.clientY - r.top) + "px";
  b.append(s); setTimeout(() => s.remove(), 520);
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (selectMode) { exitSelect(); return; } const lb = $("lightbox"); if (lb) lb.remove(); document.querySelectorAll(".pop").forEach(p => p.remove()); closeMenu(); } });
</script>
