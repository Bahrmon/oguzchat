<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06306A">
<title>OguzChat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23164194'/%3E%3Ctext x='32' y='43' font-size='32' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'%3EO%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--blue:#164194;--navy:#06306A;--blue-l:#006FB5;--text:#424A4E;--muted:#849299;--line:#C8D3E6;--band:#EEF2F8;--card:#fff;--bubble:#fff;--mine:#164194;--mine-text:#fff;--side:#06306A;--title:#06306A;--hover:#E4EAF4;--quote:#EEF2F8;
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1)}
[data-theme=dark]{--text:#D3DAE4;--muted:#8793A3;--line:#283346;--band:#0E1520;--card:#161F2C;--bubble:#1C2736;--mine:#2150B8;--side:#08162C;--title:#DCE6F5;--hover:#223047;--quote:#243247}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:var(--band);color:var(--text);height:100vh;height:100dvh;display:flex;font-size:15px;overflow:hidden}
.hidden{display:none!important}
input,textarea,button{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue-l)}
.row.mine .bubble a{color:#cfe0ff}
#auth{margin:auto;background:var(--card);border-radius:18px;box-shadow:0 20px 50px #06306a26;width:min(400px,92vw);overflow:hidden;animation:cardIn .55s var(--ease) both}
#auth .top{background:linear-gradient(135deg,#06306A,#164194);color:#fff;padding:30px 30px 26px}
#auth .brand{font-family:Montserrat,sans-serif;font-weight:700;font-size:26px;animation:fadeUp .6s .15s var(--ease) both}
#auth .sub{opacity:.75;font-size:13px;margin-top:4px;animation:fadeUp .6s .25s var(--ease) both}
#auth .body{padding:24px 30px 18px}
#auth h2{margin:0 0 12px;font-family:Montserrat,sans-serif;font-size:18px;color:var(--title)}
.inp{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);margin:6px 0;background:var(--card);outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus,#text:focus{border-color:var(--blue);box-shadow:0 0 0 3px #16419422}
.btn{width:100%;padding:12px;border-radius:10px;border:none;background:var(--blue);color:#fff;font-weight:600;margin-top:8px;position:relative;overflow:hidden;transition:transform .15s var(--spring),background .15s,box-shadow .15s}
.btn:hover{background:#06306A;box-shadow:0 6px 16px #16419440;transform:translateY(-1px)}
.btn:active{transform:scale(.95)}
.btn.ghost{background:var(--band);color:var(--title)}
.btn.danger{background:#fff0f0;color:#C62828}
[data-theme=dark] .btn.danger{background:#3a1d22;color:#ff8a80}
button.link{background:none;border:none;color:var(--blue-l);padding:10px 0 0;font-weight:500}
#err{color:#c62828;min-height:1.2em;font-size:13px}
#auth.shake{animation:shake .4s}
.powered{font-size:11px;color:var(--muted);text-align:center;padding:0 0 14px;letter-spacing:.3px}
.powered b{color:var(--blue);font-weight:600}
#app{display:flex;width:100%;height:100vh;height:100dvh}
#app.enter #side{animation:slideIn .45s var(--ease) both}
#app.enter .item{animation:slideIn .4s var(--ease) both}
#app.enter #main{animation:fadeUp .5s .1s var(--ease) both}
#side{width:280px;flex-shrink:0;background:var(--side);color:#fff;display:flex;flex-direction:column;transition:transform .3s var(--ease)}
#side .logo{font-family:Montserrat,sans-serif;font-weight:700;font-size:20px;padding:18px 16px 12px 20px;display:flex;align-items:center;gap:10px}
#side .logo .mark{width:34px;height:34px;border-radius:10px;background:#164194;display:grid;place-items:center;font-size:16px}
#side .logo .grow{flex:1}
.iconbtn{border:none;background:#ffffff14;color:#fff;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px;transition:transform .15s var(--spring),background .15s}
.iconbtn:hover{background:#ffffff26}.iconbtn:active{transform:scale(.9)}
#side .scroll{flex:1;overflow-y:auto;padding-bottom:10px}
#side h3{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#ffffff80;margin:16px 20px 6px;display:flex;align-items:center}
#side h3 button{margin-left:auto;background:none;border:none;color:#ffffffa0;font-size:18px;line-height:1;padding:0 4px;border-radius:6px}
#side h3 button:hover{color:#fff;background:#ffffff1a}
#findUser{margin:4px 12px 2px;width:calc(100% - 24px);padding:8px 12px;border-radius:9px;border:none;background:#ffffff14;color:#fff;outline:none;font-size:13px}
#findUser::placeholder{color:#ffffff70}
.item{display:flex;align-items:center;gap:10px;padding:7px 10px;margin:2px 8px;border-radius:10px;color:#ffffffd0;transition:background .12s,transform .12s;position:relative;overflow:hidden;cursor:pointer}
.item:hover{background:#ffffff14;color:#fff}
.item:active{transform:scale(.97)}
.item.active{background:#164194;color:#fff;box-shadow:0 4px 14px #0003}
.item.unread{color:#fff;font-weight:600}
.item .ic{width:30px;text-align:center;opacity:.65;font-weight:600;flex-shrink:0}
.item .lbl{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{display:block;font-size:11px;font-weight:400;opacity:.6;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{margin-left:auto;background:#E53935;color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px;flex-shrink:0}
.del{opacity:0;border:none;background:none;color:#fff;width:24px;height:24px;border-radius:6px;font-size:16px;line-height:1;transition:opacity .15s,background .15s;flex-shrink:0}
.item:hover .del{opacity:.7}.del:hover{opacity:1!important;background:#E5393580}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;color:#fff;flex-shrink:0;position:relative;user-select:none}
.av.on::after{content:"";position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:#2ECC71;border:2px solid var(--side)}
.av.ceo::before{content:"👑";position:absolute;top:-11px;left:50%;transform:translateX(-50%);font-size:12px;line-height:1;pointer-events:none;z-index:2}
#me{padding:12px 14px;border-top:1px solid #ffffff1a;display:flex;align-items:center;gap:10px;cursor:pointer;transition:background .15s}
#me:hover{background:#ffffff10}#me.active{background:#ffffff1a}
#me .nmw{flex:1;min-width:0}#me .nm{display:block;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#logout{background:#ffffff14;border:none;color:#fff;border-radius:8px;padding:7px 10px;font-size:13px}
#logout:hover{background:#ffffff26}
#side .powered{color:#ffffff66;padding:6px 0 10px}#side .powered b{color:#ffffffb0}
#main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--card);position:relative}
#head{min-height:64px;padding:8px 16px 8px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;background:var(--card)}
#head .hinfo{flex:1;min-width:0;cursor:default}
#head .hinfo.click{cursor:pointer}
#title{font-family:Montserrat,sans-serif;font-weight:600;font-size:17px;color:var(--title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#subtitle{font-size:12px;color:var(--muted);min-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#subtitle.online{color:#2E9E5B}
.hbtn{border:none;background:var(--band);color:var(--title);border-radius:10px;height:38px;min-width:38px;padding:0 10px;display:grid;place-items:center;font-size:15px;transition:transform .15s var(--spring)}
.hbtn:active{transform:scale(.92)}
#bell{font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}
#bell.on{background:none;color:var(--muted);font-weight:500}
#menuBtn{display:none}
#searchBar{display:flex;gap:8px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--card);animation:fadeUp .2s var(--ease)}
#searchBar input{flex:1;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--band);outline:none}
#searchInfo{font-size:12px;color:var(--muted);white-space:nowrap}
#pinBar{display:flex;align-items:center;gap:10px;padding:8px 16px 8px 20px;border-bottom:1px solid var(--line);background:var(--card);font-size:13px;cursor:pointer;animation:fadeUp .25s var(--ease)}
#pinBar .pl{border-left:3px solid var(--blue);padding-left:10px;flex:1;min-width:0}
#pinBar .pt{color:var(--blue-l);font-weight:600;font-size:12px}
#pinBar .px{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
#pinBar button{border:none;background:none;color:var(--muted);font-size:16px;border-radius:6px;padding:2px 6px}
#msgs{flex:1;overflow-y:auto;padding:14px 20px 8px;background:var(--band);position:relative}
#title.switch{animation:fadeUp .3s var(--ease)}
#msgs.switch{animation:fadeIn .2s ease}
#msgs.loading{opacity:.35;pointer-events:none;transition:opacity .12s}
#msgs.drag{outline:3px dashed var(--blue);outline-offset:-10px}
.day{text-align:center;margin:16px 0 10px}
.day span{background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:12px;padding:4px 12px;border-radius:20px}
.empty{text-align:center;color:var(--muted);margin-top:18vh}
.row{display:flex;gap:10px;align-items:flex-end;margin:2px 0;position:relative}
.row.mine{flex-direction:row-reverse}
.row>.av{width:34px;height:34px;visibility:hidden;cursor:pointer}
.row.first>.av{visibility:visible}
.row.first{margin-top:12px}
.row.flash .bubble{animation:flash 1.4s}
.bwrap{display:flex;flex-direction:column;max-width:min(70%,580px);min-width:0;position:relative}
.row.mine .bwrap{align-items:flex-end}
.bubble{padding:8px 12px;background:var(--bubble);border-radius:14px;box-shadow:0 1px 2px #06306a14;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.42;position:relative;max-width:100%}
.row.mine .bubble{background:var(--mine);color:var(--mine-text)}
.row.new .bubble{animation:popIn .38s var(--spring) both;transform-origin:bottom left}
.row.new.mine .bubble{animation-name:popMine;transform-origin:bottom right;animation-duration:.36s}
.row.new{animation:rowSlide .38s var(--spring) both}
.row.new.mine{animation-name:rowSlideMine}
.meta{font-size:12px;font-weight:600;margin-bottom:2px;cursor:pointer}
.meta .pos{font-weight:400;color:var(--muted);margin-left:6px;font-size:11px}
.foot{font-size:11px;color:var(--muted);margin-left:10px;float:right;margin-top:5px;display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.row.mine .foot{color:#ffffffa8}
.tick.read{color:#8FD3FF}
.fwd-hdr{font-size:12px;color:var(--blue-l);margin-bottom:5px;display:flex;align-items:center;gap:3px}
.fwd-hdr b{font-weight:600}.fwd-hdr .ff{opacity:.7}
.row.mine .fwd-hdr{color:#cfe0ff}
.badge-ceo{font-size:13px;vertical-align:middle;margin-left:3px}
.badge-admin{font-size:10px;font-weight:700;background:var(--blue);color:#fff;border-radius:5px;padding:1px 5px;vertical-align:middle;margin-left:4px;letter-spacing:.3px}
#fwdPick{position:fixed;inset:0;z-index:40;background:#0006;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
#fwdPick .sheet{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:500px;max-height:76vh;display:flex;flex-direction:column;overflow:hidden;animation:fadeUp .28s var(--spring) both}
#fwdPick .sh{padding:16px 20px 10px;font-family:Montserrat,sans-serif;font-weight:600;font-size:16px;color:var(--title);border-bottom:1px solid var(--line)}
#fwdPick .sg{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:10px 12px 4px}
#fwdPick .sl{overflow-y:auto;flex:1;padding:6px}
#fwdPick .si{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;cursor:pointer;transition:background .12s}
#fwdPick .si:hover{background:var(--hover)}
#fwdPick .si .ic2{width:36px;height:36px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:700;flex-shrink:0}
#fwdPick .cancel{border:none;background:none;color:var(--muted);padding:14px;font-size:14px;width:100%;border-top:1px solid var(--line);transition:background .12s}
#fwdPick .cancel:hover{background:var(--hover)}
.quote{border-left:3px solid var(--blue-l);background:var(--quote);border-radius:8px;padding:5px 9px;margin:2px 0 6px;font-size:13px;cursor:pointer;white-space:normal}
.row.mine .quote{background:#ffffff22;border-left-color:#fff}
.quote b{display:block;font-size:12px;color:var(--blue-l)}
.row.mine .quote b{color:#fff}
.quote span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85}
.img{display:block;max-width:100%;max-height:320px;border-radius:10px;margin:2px 0 4px;cursor:zoom-in;background:#0001}
.filecard{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--quote);text-decoration:none;color:inherit;margin:2px 0 4px;white-space:normal}
.row.mine .filecard{background:#ffffff22;color:#fff}
.filecard .fi{width:38px;height:38px;border-radius:9px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.filecard .fn{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.filecard .fs{font-size:11px;opacity:.7}
mark{background:#FFE082;color:#000;border-radius:3px;padding:0 1px}
.reacts{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:2px 8px;font-size:13px;display:flex;gap:4px;align-items:center;transition:transform .15s var(--spring)}
.chip.me{border-color:var(--blue);background:#16419418}
.chip:active{transform:scale(.9)}
.chip b{font-size:12px;font-weight:600;color:var(--muted)}
.mtrig{position:absolute;top:2px;width:26px;height:26px;border:none;border-radius:50%;background:var(--card);box-shadow:0 1px 5px #06306a28;color:var(--muted);font-size:15px;display:none;align-items:center;justify-content:center;z-index:5;padding:0;line-height:1;transition:background .12s,transform .12s var(--spring),box-shadow .12s}
.row:not(.mine) .mtrig{right:-14px}
.row.mine .mtrig{left:-14px}
.bwrap:hover .mtrig,.row.act .mtrig{display:flex}
.mtrig:hover{background:var(--hover);color:var(--title);box-shadow:0 2px 8px #06306a33}
.mtrig:active{transform:scale(.88)}
.mact{min-width:165px;padding:5px}
.mact button{width:100%;border:none;background:none;padding:9px 12px;text-align:left;border-radius:8px;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--text);transition:background .12s;cursor:pointer}
.mact button:hover{background:var(--hover)}
.mact .mi{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.mact .danger{color:#E53935}
.mact button{font-size:14px!important;width:100%!important;height:auto!important;border-radius:8px!important}
.mact button:hover{transform:none!important}
.pop{position:fixed;z-index:20;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px #06306a33;padding:8px;display:grid;gap:2px;animation:popIn .2s var(--spring) both}
.pop button{border:none;background:none;font-size:20px;width:36px;height:36px;border-radius:9px;transition:background .1s,transform .12s var(--spring)}
.pop button:hover{background:var(--hover);transform:scale(1.15)}
#typingLine{min-height:18px;padding:0 22px;font-size:12px;color:var(--blue-l);background:var(--band);font-style:italic}
#typingLine .dots span{animation:blink 1.2s infinite both}
#typingLine .dots span:nth-child(2){animation-delay:.2s}#typingLine .dots span:nth-child(3){animation-delay:.4s}
#toBottom{position:absolute;right:22px;bottom:100px;width:42px;height:42px;border-radius:50%;border:none;background:var(--card);color:var(--title);box-shadow:0 4px 14px #06306a33;font-size:18px;z-index:4;animation:popIn .25s var(--spring)}
#bar{display:flex;align-items:center;gap:10px;padding:8px 18px;border-top:1px solid var(--line);background:var(--card);font-size:13px;animation:fadeUp .2s var(--ease)}
#bar .bl{flex:1;min-width:0;border-left:3px solid var(--blue);padding-left:10px}
#bar .bt{color:var(--blue-l);font-weight:600;font-size:12px}
#bar .bx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar img{width:44px;height:44px;object-fit:cover;border-radius:8px}
#bar button{border:none;background:none;color:var(--muted);font-size:18px;border-radius:6px;padding:2px 8px}
#form{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);background:var(--card);align-items:flex-end;padding-bottom:max(12px,env(safe-area-inset-bottom))}
#text{flex:1;resize:none;max-height:150px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);outline:none;line-height:1.4;background:var(--card);transition:border-color .15s,box-shadow .15s;min-width:0}
.cbtn{width:44px;height:44px;border-radius:12px;border:none;background:var(--band);color:var(--title);display:grid;place-items:center;flex-shrink:0;font-size:18px;transition:transform .15s var(--spring),background .15s}
.cbtn:active{transform:scale(.9)}
#send{background:var(--blue);color:#fff;position:relative;overflow:hidden}
#send:hover{background:#06306A;box-shadow:0 6px 16px #16419440}
#send svg{transition:transform .25s var(--spring)}
#send.fly svg{transform:translate(4px,-4px) rotate(8deg)}
.rip{position:absolute;border-radius:50%;background:#ffffff55;pointer-events:none;width:40px;height:40px;margin:-20px 0 0 -20px;animation:ripple .5s ease-out forwards}
.ann-list{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:6px}
.ann{background:var(--card);border-radius:16px;box-shadow:0 2px 10px #06306a12;border-left:4px solid var(--blue);padding:16px 18px;animation:fadeUp .35s var(--ease) both}
.ann.new{animation:popIn .4s var(--spring) both}
.ann-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ann-h .av{width:38px;height:38px;font-size:13px;cursor:pointer}
.ann-h .av.ceo::before{font-size:15px;top:-13px}
.ann-who{font-weight:600;color:var(--title);font-size:14px}
.ann-when{font-size:12px;color:var(--muted)}
.ann-tag{margin-left:auto;font-size:11px;font-weight:600;color:var(--blue-l);background:var(--band);padding:4px 10px;border-radius:20px}
.ann-t{white-space:pre-wrap;word-wrap:break-word;line-height:1.5}
.ann-del{border:none;background:none;color:var(--muted);font-size:13px;padding:4px 8px;border-radius:6px;margin-left:6px}
.ann-del:hover{background:#E5393518;color:#E53935}
.ann-intro{max-width:760px;margin:0 auto 4px;color:var(--muted);font-size:13px;text-align:center}
.prof{max-width:560px;margin:0 auto 20px;background:var(--card);border-radius:18px;box-shadow:0 4px 20px #06306a14;overflow:hidden;animation:fadeUp .4s var(--ease) both}
.prof-top{background:linear-gradient(135deg,#06306A,#164194);padding:28px 24px 22px;color:#fff;display:flex;gap:16px;align-items:center}
.prof-top .av{width:72px;height:72px;font-size:26px;border:3px solid #ffffff40}
.prof-top .av.on::after{width:16px;height:16px;border-color:#164194}
.prof-top .av.ceo::before{font-size:26px;top:-24px}
.prof-top .pn{font-family:Montserrat,sans-serif;font-size:20px;font-weight:700}
.prof-top .pp{opacity:.85;font-size:14px;margin-top:2px}
.prof-top .ps{opacity:.7;font-size:12px;margin-top:4px}
.prof-body{padding:18px 24px 24px}
.prof-body label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:14px 0 6px}
.prof-body .inp[readonly]{background:var(--band);color:var(--muted)}
.prof-line{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.prof-line .k{font-size:12px;color:var(--muted);width:90px;flex-shrink:0}
.prof-ok{font-size:13px;margin-top:10px;min-height:1.2em;text-align:center}
.seg{display:flex;background:var(--band);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:none;background:none;padding:8px;border-radius:8px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--title);font-weight:600;box-shadow:0 1px 3px #0002}
#lightbox{position:fixed;inset:0;background:#000d;z-index:50;display:grid;place-items:center;animation:fadeIn .2s}
#lightbox img{max-width:94vw;max-height:88vh;border-radius:8px;animation:popIn .3s var(--spring)}
#lightbox a{position:absolute;top:16px;right:70px;color:#fff;text-decoration:none;background:#fff2;padding:8px 14px;border-radius:10px;font-size:14px}
#lightbox button{position:absolute;top:16px;right:16px;background:#fff2;border:none;color:#fff;width:40px;height:40px;border-radius:10px;font-size:20px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#06306A;color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;z-index:60;box-shadow:0 8px 24px #0004;animation:fadeIn .25s}
#shade{display:none}
@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.82);transform-origin:bottom left}to{opacity:1;transform:none}}
@keyframes popMine{from{opacity:0;transform:translateY(12px) scale(.78);transform-origin:bottom right}to{opacity:1;transform:none}}
@keyframes rowSlide{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
@keyframes rowSlideMine{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes ripple{to{transform:scale(2.6);opacity:0}}
@keyframes flash{0%,60%{box-shadow:0 0 0 4px #FFC10788}100%{box-shadow:0 1px 2px #06306a14}}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
@media(hover:none){.del{opacity:.6}.bwrap:hover .mtrig{display:none}.row.act .mtrig{display:flex}}
@media(max-width:760px){
  #side{position:fixed;inset:0 auto 0 0;z-index:30;transform:translateX(-100%);width:86vw;max-width:320px}
  #side.open{transform:none}
  #side.open+#shade{display:block;position:fixed;inset:0;background:#0006;z-index:25;animation:fadeIn .2s}
  #menuBtn{display:grid}
  .bwrap{max-width:82%}
  #msgs{padding:10px 10px 6px}
  #head{padding:8px 10px}
  #bell .t{display:none}
  #form{padding:10px 8px;gap:6px}
  .cbtn{width:40px;height:40px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<body>

<div id="auth">
  <div class="top"><div class="brand">OguzChat</div><div class="sub">Oguz Forum &amp; Expo — внутренний чат</div></div>
  <div class="body">

    </div>

<div id="app" class="hidden">
  <div id="side">

    <div class="scroll">

      <div id="users"></div>
    </div>
    <div id="me" title="Мой профиль"><div class="av" id="meAv"></div><div class="nmw"><span class="nm" id="meName"></span><span class="sub" id="mePos"></span></div><button id="logout">Выйти</button></div>
    <div class="powered">Powered by <b>Bahramon</b></div>
  </div>
  <div id="shade"></div>
  <div id="main">
    <div id="head">
      <button class="hbtn" id="menuBtn">☰</button>
      <div class="hinfo" id="hinfo"><div id="title">—</div><div id="subtitle"></div></div>
      <button class="hbtn" id="searchBtn" title="Поиск по сообщениям">🔍</button>
      <button class="hbtn hidden" id="bell"><span>🔔</span><span class="t">Включить уведомления</span></button>
    </div>
    <div id="searchBar" class="hidden"><input id="searchIn" placeholder="Поиск в этом чате…"><span id="searchInfo"></span><button class="hbtn" id="searchClose">✕</button></div>
    <div id="pinBar" class="hidden"><span id="pinIco"></span><div class="pl"><div class="pt">Закреплённое сообщение</div><div class="px" id="pinText"></div></div><button id="unpin" title="Открепить">✕</button></div>
    <div id="msgs"></div>
    <div id="typingLine"></div>
    <div id="bar" class="hidden"></div>
    <form id="form">
      <button type="button" class="cbtn" id="attachBtn" title="Фото или файл">📎</button>
      <input type="file" id="fileIn" class="hidden">
      <textarea id="text" rows="1" placeholder="Напишите сообщение…"></textarea>
      <button type="button" class="cbtn" id="emojiBtn" title="Эмодзи">😊</button>
      <button class="cbtn" id="send" title="Отправить"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg></button>
    </form>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, updateProfile, sendPasswordResetEmail }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, addDoc, updateDoc, deleteDoc, query, orderBy, limit, onSnapshot, serverTimestamp, arrayUnion, arrayRemove, FieldPath, deleteField }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCh6fBux6yE3OqnjTWN9k5WFdtBfzE4q5o",
  authDomain: "oguzchat-eb5a1.firebaseapp.com",
  projectId: "oguzchat-eb5a1",
  storageBucket: "oguzchat-eb5a1.firebasestorage.app",
  messagingSenderId: "1013051669571",
  appId: "1:1013051669571:web:64f3178d4e557900d1e8f6"
};
const ADMIN = "Z16C3AeohdNC4McE3zVgGuc5mRU2";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const SVG = (d,s=16) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const SVGf = (d,s=16) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor">${d}</svg>`;
window.ICONS = {
  eye:     SVG('<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',18),
  eyeOff:  SVG('<path d="M17.94 17.94A10 10 0 0 1 12 20C5 20 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9 9 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>',18),
  moon:    SVG('<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',18),
  sun:     SVG('<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>',18),
  pin:     SVG('<line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24z"/>',14),
  dots:    SVGf('<circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/>',16),
  reply:   SVG('<polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/>',14),
  react:   SVG('<circle cx="12" cy="12" r="10"/><path d="M8 13s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/>',14),
  copy:    SVG('<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',14),
  forward: SVG('<polyline points="15 17 20 12 15 7"/><path d="M4 18v-2a4 4 0 0 1 4-4h12"/>',14),
  edit:    SVG('<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>',14),
  trash:   SVG('<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',14),
};
// Setup password toggle
const passToggle = document.getElementById("passToggle");
if (passToggle) {
  passToggle.innerHTML = ICONS.eye;
  passToggle.onclick = function() {
    const p = document.getElementById("pass");
    p.type = p.type === "password" ? "text" : "password";
    this.innerHTML = p.type === "password" ? ICONS.eye : ICONS.eyeOff;
  };
}
// Setup pin bar icon
const pinIco = document.getElementById("pinIco");
if (pinIco) pinIco.innerHTML = ICONS.pin;

let me = null, started = false, current = null;
let usersMap = {}, channelsList = [], unsubMsgs = null, unsubConv = null, lastSnap = null, seen = null;
let replyTo = null, editing = null, attach = null, searchQ = "", convData = {};
const unread = {}, titles = {}, watched = {};
const QUICK = ["👍", "❤️", "😂", "😮", "😢", "🙏", "🔥", "✅"];
const EMOJI = "😀 😃 😄 😁 😅 😂 🙂 😉 😊 😍 😘 🤔 😎 😴 😢 😭 😡 😮 🥳 🤝 👍 👎 👏 🙌 🙏 💪 👀 🎉 🔥 ❤️ 💙 ✅ ❌ ⚠️ 📌 📎 📅 ⏰ 📞 ✈️ 🏢 ☕ 🍰 🌹 ⭐ 💡 📢 🇹🇲".split(" ");
const PAL = ["#164194","#006FB5","#0E7C86","#5B4BB7","#B5541C","#2E7D32","#AD1457","#4F6C92"];
const color = k => { let h = 0; for (const c of (k || "")) h = (h * 31 + c.charCodeAt(0)) >>> 0; return PAL[h % PAL.length]; };
const initials = n => (n || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase();
const ms = t => t && t.toMillis ? t.toMillis() : 0;
const isOnline = u => !!u && Date.now() - ms(u.lastSeen) < 150000;
const uName = (uid, fb) => (usersMap[uid] && usersMap[uid].name) || fb || "Сотрудник";
const isCEO = uid => { const u = usersMap[uid]; return u && u.name && u.name.startsWith("Gerchek"); };
const isDM = id => !!id && id.startsWith("dm_");
const isChan = id => !!id && id !== "ann" && id !== "profile" && !id.startsWith("user:") && !isDM(id);
const fmtTime = d => d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
const fmtDay = d => d.toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
function toast(t) { const o = $("toast"); if (o) o.remove(); const x = el("div", null, t); x.id = "toast"; document.body.append(x); setTimeout(() => x.remove(), 2400); }
function avatar(uid, name, cls) { const a = el("div", "av" + (cls ? " " + cls : ""), initials(name)); a.style.background = color(uid); if (isOnline(usersMap[uid])) a.classList.add("on"); if (isCEO(uid)) a.classList.add("ceo"); return a; }
function lastSeenText(u) {
  if (!u) return ""; if (isOnline(u)) return "в сети";
  const t = ms(u.lastSeen); if (!t) return "не в сети";
  const d = new Date(t), today = fmtDay(new Date()) === fmtDay(d);
  return "был(а) " + (today ? "сегодня в " + fmtTime(d) : fmtDay(d) + " в " + fmtTime(d));
}

/* ---------- тема ---------- */
let theme = store.get("oc-theme") || "light";
let keysOn = store.get("oc-keys") !== "off";
function applyTheme(t) {
  const dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  $("themeBtn").innerHTML = dark ? ICONS.sun : ICONS.moon;
}
applyTheme(theme);
$("themeBtn").onclick = () => { theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; store.set("oc-theme", theme); applyTheme(theme); };

/* ---------- вход ---------- */
let registering = false;
$("toggle").onclick = () => {
  registering = !registering;
  $("authTitle").textContent = registering ? "Регистрация" : "Вход";
  $("authBtn").textContent = registering ? "Зарегистрироваться" : "Войти";
  $("toggle").textContent = registering ? "Уже есть аккаунт? Войти" : "Нет аккаунта? Регистрация";
  $("name").classList.toggle("hidden", !registering);
  $("forgot").classList.toggle("hidden", registering);
};
const ERR = { "auth/invalid-credential": "Неверный email или пароль", "auth/invalid-email": "Неверный формат email", "auth/email-already-in-use": "Этот email уже зарегистрирован", "auth/weak-password": "Пароль слишком короткий (мин. 6 символов)", "auth/too-many-requests": "Слишком много попыток, подождите немного", "auth/missing-password": "Введите пароль", "auth/network-request-failed": "Нет подключения к интернету", "auth/user-not-found": "Такой email не зарегистрирован" };
function authErr(e) { $("err").style.color = ""; $("err").textContent = ERR[e.code] || String(e.message || e).replace("Firebase: ", ""); const a = $("auth"); a.classList.remove("shake"); void a.offsetWidth; a.classList.add("shake"); }
$("authBtn").onclick = async () => {
  $("err").textContent = "";
  const email = $("email").value.trim(), pass = $("pass").value;
  try {
    if (registering) {
      const name = $("name").value.trim();
      if (!name) throw { code: "x", message: "Введите имя" };
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(cred.user, { displayName: name });
      await setDoc(doc(db, "users", cred.user.uid), { name, email }, { merge: true });
      start(cred.user);
    } else await signInWithEmailAndPassword(auth, email, pass);
  } catch (e) { authErr(e); }
};
$("pass").addEventListener("keydown", e => { if (e.key === "Enter") $("authBtn").click(); });
$("forgot").onclick = async () => {
  const email = $("email").value.trim();
  if (!email) { $("err").style.color = ""; $("err").textContent = "Введите email, затем нажмите «Забыли пароль?»"; return; }
  try { await sendPasswordResetEmail(auth, email); $("err").style.color = "#2E7D32"; $("err").textContent = "Письмо для сброса пароля отправлено на " + email; }
  catch (e) { authErr(e); }
};
$("logout").onclick = e => { e.stopPropagation(); signOut(auth).then(() => location.reload()); };
onAuthStateChanged(auth, user => {
  if (user && user.displayName) start(user);
  else if (!user) { $("app").classList.add("hidden"); $("auth").classList.remove("hidden"); }
});

/* ---------- запуск ---------- */
function start(user) {
  me = user;
  if ($("app").classList.contains("hidden")) { $("app").classList.add("enter"); setTimeout(() => $("app").classList.remove("enter"), 700); }
  $("auth").classList.add("hidden"); $("app").classList.remove("hidden");
  if (started) return; started = true;
  renderMe();
  onSnapshot(query(collection(db, "channels"), orderBy("name")), snap => {
    channelsList = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderSidebar();
    if (isChan(current) && !channelsList.some(c => c.id === current)) current = null;
    if (!current) {
      if (!channelsList.length) setDoc(doc(db, "channels", "general"), { name: "общий" });
      else { const f = channelsList.find(c => c.id === store.get("oc-last")) || channelsList[0]; open(f.id); }
    }
  });
  onSnapshot(query(collection(db, "users"), orderBy("name")), snap => {
    usersMap = {}; snap.forEach(d => usersMap[d.id] = d.data());
    if (!usersMap[me.uid]) setDoc(doc(db, "users", me.uid), { name: me.displayName, email: me.email || "" }, { merge: true }).catch(() => {});
    renderSidebar(); renderMe(); checkInitialUnread();
    if (current && current !== "profile" && !current.startsWith("user:")) { headerInfo(); rerender(); }
  });
  heartbeat(); setInterval(heartbeat, 60000);
  setInterval(() => { renderSidebar(); if (current && current !== "profile" && !current.startsWith("user:")) headerInfo(); }, 30000);
  setInterval(showTyping, 2000);
  bellState();
}
function heartbeat() { if (me && !document.hidden) setDoc(doc(db, "users", me.uid), { lastSeen: serverTimestamp() }, { merge: true }).catch(() => {}); }
function renderMe() {
  const u = usersMap[me.uid] || {}, n = u.name || me.displayName;
  $("meName").textContent = n; $("mePos").textContent = u.position || "Заполните профиль";
  const a = $("meAv"); a.textContent = initials(n); a.style.background = color(me.uid);
}

/* ---------- боковая панель ---------- */
function item(id, label, icon, opts = {}) {
  titles[id] = opts.title || label;
  const it = el("div", "item" + (id === current ? " active" : "")); it.dataset.id = id;
  const ic = typeof icon === "string" ? el("span", "ic", icon) : icon;
  const lb = el("span", "lbl", label); if (opts.sub) lb.append(el("span", "sub", opts.sub));
  it.append(ic, lb);
  if (opts.onDel) { const x = el("button", "del", "×"); x.title = "Удалить"; x.onclick = ev => { ev.stopPropagation(); opts.onDel(it); }; it.append(x); }
  it.onclick = () => { open(id); $("side").classList.remove("open"); };
  watch(id);
  return it;
}
function renderSidebar() {
  if (!me) return;
  const ab = $("annBox"); ab.innerHTML = ""; const ai = item("ann", "Объявления", "📢", { title: "📢 Объявления" }); ai.style.marginTop = "4px"; ab.append(ai);
  const ch = $("channels"); ch.innerHTML = "";
  channelsList.forEach(c => ch.append(item(c.id, c.name, "#", {
    title: "# " + c.name,
    onDel: (me.uid === ADMIN || c.owner === me.uid) ? async it => {
      if (!confirm("Удалить канал «" + c.name + "»? Его сообщения больше не будут видны.")) return;
      it.style.transition = "all .25s"; it.style.opacity = "0"; it.style.transform = "translateX(-20px)";
      try { await deleteDoc(doc(db, "channels", c.id)); } catch (e) { toast("Не удалось удалить: " + e.code); it.style.opacity = ""; it.style.transform = ""; }
    } : null
  })));
  const us = $("users"); us.innerHTML = "";
  const q = $("findUser").value.trim().toLowerCase();
  const list = Object.entries(usersMap).filter(([uid]) => uid !== me.uid)
    .sort((a, b) => (isOnline(b[1]) - isOnline(a[1])) || (a[1].name || "").localeCompare(b[1].name || ""));
  let online = 0;
  list.forEach(([uid, u]) => {
    if (isOnline(u)) online++;
    if (q && !((u.name || "") + " " + (u.position || "") + " " + (u.department || "")).toLowerCase().includes(q)) return;
    const id = "dm_" + [me.uid, uid].sort().join("_");
    us.append(item(id, u.name || "—", avatar(uid, u.name), { title: u.name, sub: u.position }));
  });
  $("onlineCnt").textContent = online ? "· " + online + " в сети" : "";
  renderBadges();
}
$("findUser").oninput = renderSidebar;
$("newChan").onclick = async () => {
  const name = prompt("Название канала:");
  if (name && name.trim()) { try { const r = await addDoc(collection(db, "channels"), { name: name.trim().slice(0, 40), owner: me.uid }); titles[r.id] = "# " + name.trim(); open(r.id); } catch (e) { toast("Ошибка: " + e.code); } }
};

function linkify(node, text, q) {

$("attachBtn").onclick = () => $("fileIn").click();

const mbox = $("msgs");
mbox.addEventListener("dragover", e => { if (isChan(current) || isDM(current)) { e.preventDefault(); mbox.classList.add("drag"); } });

const readAs = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(f); });

    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);

}
async function takeFile(f) {

    } else {

      attach = { file: { name: f.name, size: f.size, type: f.type || "application/octet-stream", data: await readAs(f) } };
      setBar("📎", "Файл", { text: f.name + " · " + fmtSize(f.size) });

  } catch (e) { toast("Не удалось прочитать файл"); }
}

function picker(anchor, list, onPick, cols) {
  document.querySelectorAll(".pop").forEach(p => p.remove());
  const p = el("div", "pop"); p.style.gridTemplateColumns = "repeat(" + (cols || 8) + ",36px)";
  list.forEach(x => { const b = el("button", null, x); b.type = "button"; b.onclick = ev => { ev.stopPropagation(); onPick(x); p.remove(); }; p.append(b); });

  const left = Math.min(window.innerWidth - pr.width - 8, Math.max(8, r.left + r.width / 2 - pr.width / 2));
  let top = r.top - pr.height - 8; if (top < 8) top = r.bottom + 8;

$("emojiBtn").onclick = e => picker(e.currentTarget, EMOJI, x => { const s = ta.selectionStart ?? ta.value.length; ta.value = ta.value.slice(0, s) + x + ta.value.slice(s); ta.focus(); ta.selectionStart = ta.selectionEnd = s + x.length; autoGrow(); }, window.innerWidth < 500 ? 7 : 8);

/* ---------- прочитано / непрочитано / уведомления ---------- */
const readThrottle = {};
function markRead(id) {
  if (!id || id === "profile" || id.startsWith("user:") || document.hidden || !document.hasFocus()) return;
  if (Date.now() - (readThrottle[id] || 0) < 4000) return; readThrottle[id] = Date.now();
  setDoc(doc(db, "users", me.uid), { reads: { [id]: serverTimestamp() } }, { merge: true }).catch(() => {});
}
function checkInitialUnread() {
  if (!me || !usersMap[me.uid]) return;
  const myReads = usersMap[me.uid].reads || {};
  Object.keys(watched).forEach(id => {
    const w = watched[id]; if (!w.last || w.checked) return; w.checked = true;
    if (id === current) return;
    if (w.last.uid !== me.uid && w.last.t > ms(myReads[id]) && !unread[id]) unread[id] = -1;
  });
  renderBadges();
}
function watch(id) {
  if (watched[id]) return; watched[id] = { t: null };
  onSnapshot(query(msgsRef(id), orderBy("time", "desc"), limit(1)), snap => {
    const w = watched[id];
    if (snap.empty) { if (w.t === null) w.t = 0; return; }
    const m = snap.docs[0].data(); if (!m.time) return;
    const t = ms(m.time);
    if (w.t === null) { w.t = t; w.last = { t, uid: m.uid }; checkInitialUnread(); return; }
    if (t <= w.t) return;
    w.t = t; w.last = { t, uid: m.uid };
    if (!me || m.uid === me.uid) return;
    const visible = id === current && !document.hidden && document.hasFocus();
    if (visible) { beep(true); return; }
    unread[id] = Math.max(0, unread[id] || 0) + 1; renderBadges(); beep();
    if ("Notification" in window && Notification.permission === "granted") {
      const title = isDM(id) ? uName(m.uid, m.name) : uName(m.uid, m.name) + " · " + (titles[id] || "");
      const body = m.text ? m.text.slice(0, 160) : m.image ? "📷 Фото" : "📎 Файл";
      try { const n = new Notification(title, { body, tag: id, icon: document.querySelector("link[rel=icon]").href }); n.onclick = () => { window.focus(); open(id); n.close(); }; } catch (e) {}
    }
  }, () => {});
}
function renderBadges() {
  document.querySelectorAll(".item[data-id]").forEach(it => {
    const n = unread[it.dataset.id] || 0; let bd = it.querySelector(".badge");
    it.classList.toggle("unread", n !== 0);

    else if (bd) bd.remove();

  const vals = Object.values(unread), total = vals.reduce((a, b) => a + (b > 0 ? b : 0), 0), any = vals.some(v => v);
  document.title = total ? "(" + total + ") OguzChat" : any ? "• OguzChat" : "OguzChat";
}
let actx;
function beep(soft) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), now = actx.currentTime;
    o.type = "sine"; o.frequency.setValueAtTime(soft ? 660 : 880, now); o.frequency.exponentialRampToValueAtTime(soft ? 880 : 1320, now + 0.12);
    g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(soft ? 0.07 : 0.18, now + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
    o.connect(g); g.connect(actx.destination); o.start(now); o.stop(now + 0.32);
  } catch (e) {}
}
let noiseBuf = null;
function keyClick(type) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    if (!noiseBuf) { const len = Math.floor(actx.sampleRate * 0.04); noiseBuf = actx.createBuffer(1, len, actx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
    const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    const del = !!type && type.startsWith("delete"), br = type === "insertLineBreak" || type === "insertParagraph";
    f.type = "bandpass"; f.frequency.value = del ? 1100 : br ? 850 : 1900 + Math.random() * 1300; f.Q.value = 1.1;
    g.gain.value = del ? 0.28 : 0.38;
    src.buffer = noiseBuf; src.playbackRate.value = 0.85 + Math.random() * 0.3;
    src.connect(f); f.connect(g); g.connect(actx.destination); src.start();

}
function bellState() {
  const b = $("bell"); if (!("Notification" in window)) { b.classList.add("hidden"); return; }
  if (Notification.permission === "granted") b.classList.add("hidden");
  else { b.classList.remove("hidden"); if (Notification.permission === "denied") { b.querySelector(".t").textContent = "Уведомления запрещены"; b.classList.add("on"); } }
}
async function enableNotif() {

  if ("Notification" in window && Notification.permission === "default") await Notification.requestPermission();

$("bell").onclick = enableNotif;
document.addEventListener("pointerdown", () => { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {} }, { once: true });
const onBack = () => { if (!document.hidden && current && me) { if (unread[current]) { unread[current] = 0; renderBadges(); } markRead(current); heartbeat(); } };
document.addEventListener("visibilitychange", onBack); window.addEventListener("focus", onBack);

/* ---------- поиск ---------- */
$("searchBtn").onclick = () => { const s = $("searchBar"); if (s.classList.contains("hidden")) { s.classList.remove("hidden"); $("searchIn").focus(); } else closeSearch(); };

function showProfile(uid) {

  current = uid === me.uid ? "profile" : "user:" + uid; seen = null;
  highlightNav(); $("side").classList.remove("open");
  $("form").classList.add("hidden"); $("pinBar").classList.add("hidden"); $("typingLine").innerHTML = ""; $("searchBtn").classList.add("hidden");
  const own = uid === me.uid, u = usersMap[uid] || {};
  $("title").textContent = own ? "👤 Мой профиль" : "👤 " + (u.name || "Сотрудник"); switchAnim();
  const sub = $("subtitle"); sub.className = ""; sub.textContent = own ? "Ваши данные видят все сотрудники" : lastSeenText(u); $("hinfo").onclick = null; $("hinfo").classList.remove("click");
  const box = $("msgs"); box.innerHTML = "";

  const pn = el("div", "pn"), pp = el("div", "pp"), ps = el("div", "ps", own ? "" : lastSeenText(u));

    pn.textContent = u.name || "—";

    const line = (k, v, href) => { if (!v) return; const r = el("div", "prof-line"); r.append(el("div", "k", k)); const val = href ? el("a", null, v) : el("div", null, v); if (href) val.href = href; r.append(val); body.append(r); };
    line("Должность", u.position); line("Отдел", u.department); line("Телефон", u.phone, u.phone ? "tel:" + u.phone.replace(/[^\d+]/g, "") : null); line("Email", u.email, u.email ? "mailto:" + u.email : null);
    const w = el("button", "btn", "✉ Написать сообщение"); w.style.marginTop = "18px"; w.onclick = () => open("dm_" + [me.uid, uid].sort().join("_")); body.append(w);
    if (me.uid === ADMIN) {
      const d = el("button", "btn danger", "Убрать из списка сотрудников");
      d.onclick = async () => { if (!confirm("Убрать " + (u.name || "сотрудника") + " из списка? Если он снова войдёт в чат, то появится опять.")) return;
        try { await deleteDoc(doc(db, "users", uid)); toast("Сотрудник убран из списка"); open(channelsList[0] ? channelsList[0].id : "ann"); } catch (e) { toast("Ошибка: " + e.code); } };
      body.append(d);
    }

  }
  const f = (lbl, id, ph, ro) => { body.append(el("label", null, lbl)); const i = el("input", "inp"); i.id = id; i.maxLength = 60; if (ph) i.placeholder = ph; if (ro) i.readOnly = true; body.append(i); return i; };
  const fN = f("Имя и фамилия", "fName"), fP = f("Должность", "fPos", "Например: Менеджер проектов"), fD = f("Отдел", "fDep", "Например: MICE"), fT = f("Телефон", "fPhone", "+993 …"), fE = f("Email", "fEmail", "", true);
  fN.value = u.name || me.displayName || ""; fP.value = u.position || ""; fD.value = u.department || ""; fT.value = u.phone || ""; fE.value = me.email || "";
  const preview = () => { const n = fN.value.trim() || "—"; pn.textContent = n; if (isCEO(me.uid)) pn.append(el("span", "badge-ceo", " 👑")); if (me.uid === ADMIN) pn.append(el("span", "badge-admin", " Admin")); av.textContent = initials(n); pp.textContent = [fP.value.trim(), fD.value.trim()].filter(Boolean).join(" · ") || "Должность не указана"; };
  preview(); [fN, fP, fD].forEach(i => i.addEventListener("input", preview));
  const save = el("button", "btn", "Сохранить"); save.style.marginTop = "20px"; const ok = el("div", "prof-ok"); body.append(save, ok);
  save.onclick = async () => {
    const n = fN.value.trim(); if (!n) { ok.style.color = "#c62828"; ok.textContent = "Введите имя"; return; }
    save.disabled = true; ok.textContent = "";
    try {
      await setDoc(doc(db, "users", me.uid), { name: n, position: fP.value.trim(), department: fD.value.trim(), phone: fT.value.trim(), email: me.email || "" }, { merge: true });
      if (n !== me.displayName) await updateProfile(me, { displayName: n });
      ok.style.color = "#2E7D32"; ok.textContent = "✓ Сохранено";
    } catch (e) { ok.style.color = "#c62828"; ok.textContent = "Ошибка: " + e.code; }
    save.disabled = false;
  };
  body.append(el("label", null, "Тема оформления"));
  const seg = el("div", "seg");
  [["light", "☀️ Светлая"], ["dark", "🌙 Тёмная"], ["system", "💻 Как в системе"]].forEach(([k, t]) => {
    const b = el("button", theme === k ? "on" : "", t); b.type = "button";
    b.onclick = () => { theme = k; store.set("oc-theme", k); applyTheme(k); seg.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); }; seg.append(b);
  });
  body.append(seg);
  body.append(el("label", null, "Звук клавиатуры при наборе"));
  const kseg = el("div", "seg");

  });
